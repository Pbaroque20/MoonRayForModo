    <hash type="Sheet" key="MoonRayNative13:sheet">
      <atom type="Label">DwaToonMaterial</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.filter13</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.editNative">
        <atom type="Label">Material inputs / searchable editor...</atom>
      </list>
      <list type="Control" val="sub MoonRay_DwaToonMaterial_0:sheet">
        <atom type="Label">Diffuse</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param13_0 ?">
          <atom type="Label">albedo</atom>
          <atom type="Tooltip">the overall surface color as seen from a distance (ie. diffuse color) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_2 ?">
          <atom type="Label">bssrdf</atom>
          <atom type="Tooltip">0 for NormalizedDiffuse, 1 for Dipole, 2 for random walk Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_12 ?">
          <atom type="Label">colors</atom>
          <atom type="Tooltip">List of colors on the ramp Default: {Rgb(0.0), Rgb(0.25), Rgb(0.75), Rgb(1.0)}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_13 ?">
          <atom type="Label">crease attenuation</atom>
          <atom type="Tooltip">This mitigates the over-brightening around creases which random walk SSS can cause. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_14 ?">
          <atom type="Label">diffuse flatness</atom>
          <atom type="Tooltip">Flattens out the diffuse response by bending the normal towards the light direction Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_15 ?">
          <atom type="Label">diffuse flatness falloff</atom>
          <atom type="Tooltip">Fades out flatness with respect to light direction Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_17 ?">
          <atom type="Label">diffuse model</atom>
          <atom type="Tooltip">The method used to render the diffuse response. Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_18 ?">
          <atom type="Label">diffuse roughness</atom>
          <atom type="Tooltip">Roughness of the diffuse shading.  If the value is zero a Lambertian model is used.  If it's above zero the Oren Nayar model is used.   Not compatible with subsurface scattering. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_19 ?">
          <atom type="Label">diffuse transmission</atom>
          <atom type="Tooltip">multiplier on the amount of light that is transmitted through the surface. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_20 ?">
          <atom type="Label">diffuse transmission blending behavior</atom>
          <atom type="Tooltip">Controls how diffuse transmission color attenuates diffuse reflection Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_21 ?">
          <atom type="Label">diffuse transmission color</atom>
          <atom type="Tooltip">the color/amount of light that is transmitted through the surface. Default: Rgb(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_24 ?">
          <atom type="Label">enable sss input normal</atom>
          <atom type="Tooltip">enables sampling the normal map for sss samples. More accurate but potentially expensive Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_25 ?">
          <atom type="Label">extend ramp</atom>
          <atom type="Tooltip">Extends the last ramp color to unlit portions. IMPORTANT: Only works in conjuction with prevent_light_culling ON and visible_shadows OFF Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_61 ?">
          <atom type="Label">interpolations</atom>
          <atom type="Tooltip">None: 0 | Linear: 1 | Exponential Up: 2 | Exponential Down: 3 |\n\t\t\tSmooth: 4 | Catmull Rom: 5 | Monotone Cubic: 6 Default: {0, 0, 0, 0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_81 ?">
          <atom type="Label">positions</atom>
          <atom type="Tooltip">ramp positions, maximum 10 allowed Default: {0.0, 0.25, 0.75, 1.0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_84 ?">
          <atom type="Label">ramp color multiplier</atom>
          <atom type="Tooltip">Bindable multiplier on the ramp color Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_85 ?">
          <atom type="Label">ramp input scale</atom>
          <atom type="Tooltip">Factor to apply to the input diffuse reflectance before using it as the input to the ramp Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_86 ?">
          <atom type="Label">ramp position offset</atom>
          <atom type="Tooltip">Bindable offset to the ramp-position, add a small variation using noise etc for art-directable ramp thresholds Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_88 ?">
          <atom type="Label">resolve self intersections</atom>
          <atom type="Tooltip">tries to resolve self-intersecting geometry automatically by only evaluating 'exiting' intersections for subsurface evaluations Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_90 ?">
          <atom type="Label">scattering color</atom>
          <atom type="Tooltip">the subsurface scattering 'falloff' color Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_91 ?">
          <atom type="Label">scattering radius</atom>
          <atom type="Tooltip">the distance the light scatters beneath the surface. When 0 surface diffuse (lambertian or toon) is used Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_94 ?">
          <atom type="Label">show diffuse</atom>
          <atom type="Tooltip">enables/disables diffuse reflectance Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_104 ?">
          <atom type="Label">terminator shift</atom>
          <atom type="Tooltip">Controls how the diffuse ligthing falls off.  Values greater than 0.0 shift the falloff point closer to the light source and values less than 0.0 shift the falloff point further away Default: 0.05f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaToonMaterial_1:sheet">
        <atom type="Label">Specular</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param13_1 ?">
          <atom type="Label">anisotropy</atom>
          <atom type="Tooltip">controls the shape of the primary reflection Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_76 ?">
          <atom type="Label">metallic</atom>
          <atom type="Tooltip">enables/disables metallic model (binary 0|1 for plausibility) Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_77 ?">
          <atom type="Label">metallic color</atom>
          <atom type="Tooltip">the overall reflection color, defines Fresnel behavior Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_78 ?">
          <atom type="Label">metallic edge color</atom>
          <atom type="Tooltip">the reflection color at grazing angles, defines Fresnel behavior Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_87 ?">
          <atom type="Label">refractive index</atom>
          <atom type="Tooltip">defines the Fresnel behavior (affects only refraction when model is Toon) Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_89 ?">
          <atom type="Label">roughness</atom>
          <atom type="Tooltip">the roughness of the surface Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_92 ?">
          <atom type="Label">shading tangent</atom>
          <atom type="Tooltip">controls the orientation of anistropy Default: Vec2f(1.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_98 ?">
          <atom type="Label">show specular</atom>
          <atom type="Tooltip">enables/disables specular reflections Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_102 ?">
          <atom type="Label">specular model</atom>
          <atom type="Tooltip">sets the normal distribution function for specular.  GGX is currently isotropic only Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_106 ?">
          <atom type="Label">toon specular enable indirect reflections</atom>
          <atom type="Tooltip">enables indirect GGX reflections for toon specular model Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_107 ?">
          <atom type="Label">toon specular enable input normal</atom>
          <atom type="Tooltip">enables sampling the normal map for toon toon specular Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_108 ?">
          <atom type="Label">toon specular fresnel blend</atom>
          <atom type="Tooltip">The amount of fresnel to use for the toon specular response Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_109 ?">
          <atom type="Label">toon specular indirect reflections intensity</atom>
          <atom type="Tooltip">the intensity for the indirect reflections of the toon specular model Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_110 ?">
          <atom type="Label">toon specular indirect reflections roughness</atom>
          <atom type="Tooltip">the roughness for the indirect reflections of the toon specular model Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_111 ?">
          <atom type="Label">toon specular input U</atom>
          <atom type="Tooltip">input U / tangent for specular stretch Default: Vec3f(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_112 ?">
          <atom type="Label">toon specular input V</atom>
          <atom type="Tooltip">input V / bitangent for specular stretch Default: Vec3f(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_114 ?">
          <atom type="Label">toon specular input normal dial</atom>
          <atom type="Tooltip">controls influence of input normal versus hair normal for toon toon specular Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_115 ?">
          <atom type="Label">toon specular intensity</atom>
          <atom type="Tooltip">The overall intensity of the toon specular response Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_116 ?">
          <atom type="Label">toon_specular_interpolations</atom>
          <atom type="Tooltip">None: 0 | Linear: 1 | Exponential Up: 2 | Exponential Down: 3 |\n\t\t\tSmooth: 4 | Catmull Rom: 5 | Monotone Cubic: 6 Default: {0, 0, 0, 0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_117 ?">
          <atom type="Label">toon specular mult</atom>
          <atom type="Tooltip">Bindable multiplier on the toon specular ramp value Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_118 ?">
          <atom type="Label">toon specular offset</atom>
          <atom type="Tooltip">Bindable offset to the toon specular ramp-position, add a small variation using noise etc for art-directable ramp thresholds Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_119 ?">
          <atom type="Label">toon_specular_positions</atom>
          <atom type="Tooltip">ramp positions, maximum 10 allowed Default: {0.0, 0.25, 0.75, 1.0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_120 ?">
          <atom type="Label">toon specular ramp input scale</atom>
          <atom type="Tooltip">Scales the input value x to the ramp lookup y, where x is based on the angle between the sample direction and normal.  This has the effect of squashing or stretching the ramp point positions towards/away from 0. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_121 ?">
          <atom type="Label">toon specular stretch u</atom>
          <atom type="Tooltip">Amount to stretch or compress the specular in the u direction  Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_122 ?">
          <atom type="Label">toon specular stretch v</atom>
          <atom type="Tooltip">Amount to stretch or compress the specular in the v direction  Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_123 ?">
          <atom type="Label">toon specular tint</atom>
          <atom type="Tooltip"> Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_124 ?">
          <atom type="Label">toon specular use input vectors for stretch</atom>
          <atom type="Tooltip">when checked, use input_U and V. otherwise use geometry dPds/t Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_125 ?">
          <atom type="Label">toon_specular_values</atom>
          <atom type="Tooltip">List of colors on the ramp Default: {1.0, 0.75, 0.25, 0.0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaToonMaterial_2:sheet">
        <atom type="Label">Common</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param13_3 ?">
          <atom type="Label">casts caustics</atom>
          <atom type="Tooltip">allows continuation of caustic light paths. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_82 ?">
          <atom type="Label">presence</atom>
          <atom type="Tooltip">controls the visibility of this object. Useful for fading an object in/out, or to specify a cut-out mask on thin single-sided geometry (eg. a complex leaf texture on a simple card). Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_105 ?">
          <atom type="Label">thin geometry</atom>
          <atom type="Tooltip">enables proper shading of infinitely thin geometry such as paper or leaves. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaToonMaterial_3:sheet">
        <atom type="Label">Clearcoat</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param13_4 ?">
          <atom type="Label">clearcoat</atom>
          <atom type="Tooltip">enables/disables clearcoat (binary 0|1 for plausibility) Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_5 ?">
          <atom type="Label">clearcoat attenuation color</atom>
          <atom type="Tooltip">the attenuation color of the clearcoat when 'cleacoat thickness' &gt; 0 Default: Rgb(0.5f, 0.5f, 0.5f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_6 ?">
          <atom type="Label">clearcoat bending</atom>
          <atom type="Tooltip">(advanced, recommended ON) bends rays based on the clearcoat-refractive-index before evaluating the lobes under clearcoat Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_7 ?">
          <atom type="Label">clearcoat model</atom>
          <atom type="Tooltip">sets the normal distribution function for clearcoat.  GGX is currently isotropic only Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_8 ?">
          <atom type="Label">clearcoat normal dial</atom>
          <atom type="Tooltip">controls the amount of infuence of the alternate clearcoat normal Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_9 ?">
          <atom type="Label">clearcoat refractive index</atom>
          <atom type="Tooltip">defines the Fresnel behavior Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_10 ?">
          <atom type="Label">clearcoat roughness</atom>
          <atom type="Tooltip">the roughness of the clearcoat lobe Default: 0.1f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_11 ?">
          <atom type="Label">clearcoat thickness</atom>
          <atom type="Tooltip">the thickness of the virtual clearcoat layer. Values &gt; 0 enable absorption Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_93 ?">
          <atom type="Label">show clearcoat</atom>
          <atom type="Tooltip">enables/disables clearcoat Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param13_130 ?">
          <atom type="Label">use independent clearcoat normal</atom>
          <atom type="Tooltip">specifies whether the clearcoat lobe should use an independent normal Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
