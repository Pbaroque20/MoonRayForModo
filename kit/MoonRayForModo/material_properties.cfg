          <atom type="Tooltip">Roughness of the diffuse shading.  If the value is zero a Lambertian model is used.  If it's above zero the Oren Nayar model is used.   Not compatible with subsurface scattering. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_14 ?">
          <atom type="Label">diffuse transmission</atom>
          <atom type="Tooltip">multiplier on the amount of light that is transmitted through the surface. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_15 ?">
          <atom type="Label">diffuse transmission blending behavior</atom>
          <atom type="Tooltip">Controls how diffuse transmission color attenuates diffuse reflection Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_16 ?">
          <atom type="Label">diffuse transmission color</atom>
          <atom type="Tooltip">the color/amount of light that is transmitted through the surface. Default: Rgb(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_18 ?">
          <atom type="Label">enable sss input normal</atom>
          <atom type="Tooltip">enables sampling the normal map for sss samples. More accurate but potentially expensive Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_70 ?">
          <atom type="Label">resolve self intersections</atom>
          <atom type="Tooltip">tries to resolve self-intersecting geometry automatically by only evaluating 'exiting' intersections for subsurface evaluations Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_72 ?">
          <atom type="Label">scattering color</atom>
          <atom type="Tooltip">the subsurface scattering 'falloff' color Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_73 ?">
          <atom type="Label">scattering radius</atom>
          <atom type="Tooltip">the distance the light scatters beneath the surface. When 0 surface diffuse (lambertian or toon) is used Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_76 ?">
          <atom type="Label">show diffuse</atom>
          <atom type="Tooltip">enables/disables diffuse reflectance Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
