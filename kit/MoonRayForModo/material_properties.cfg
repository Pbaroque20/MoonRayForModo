          <atom type="Tooltip">Second color to interpolate to around the hue wheel Default: Rgb(1.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_65 ?">
          <atom type="Label">iridescence thickness</atom>
          <atom type="Tooltip">Controls how much the color spectrum is repeated Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaSolidDielectricMaterial_9:sheet">
        <atom type="Label">Normal Anti-aliasing</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param11_66 ?">
          <atom type="Label">normal AA dial</atom>
          <atom type="Tooltip">Controls the amount roughness compensation from the normal map AA strategy. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param11_67 ?">
          <atom type="Label">normal AA strategy</atom>
          <atom type="Tooltip">Normal map anti-aliasing strategy to use - 'none' uses regular mip-mapping, 'toksvig' increases specular roughness corresponding to the geometric details filtered out because of mip-mapping. Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaSolidDielectricMaterial_10:sheet">
        <atom type="Label">Advanced</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param11_81 ?">
          <atom type="Label">specular</atom>
          <atom type="Tooltip">enables/disables specular reflections (binary 0|1 for plausibility) Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayNative12:sheet">
