<?xml version='1.0' encoding='utf-8'?>
<configuration>
  <atom type="Attributes">
    <hash type="Sheet" key="MoonRayNative1:sheet">
      <atom type="Label">DwaAdjustMaterial</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.filter1</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.editNative">
        <atom type="Label">Material inputs / searchable editor...</atom>
      </list>
      <list type="Control" val="sub MoonRay_DwaAdjustMaterial_0:sheet">
        <atom type="Label">Enable</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param1_0 ?">
          <atom type="Label">adjust_color</atom>
          <atom type="Tooltip">use color adjustment attrs: color_hue_shift, color_saturation, color_gain Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_1 ?">
          <atom type="Label">adjust_presence</atom>
          <atom type="Tooltip">use presence adjustment attrs: presence_set, presence_set_blend, presence_mult Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_2 ?">
          <atom type="Label">adjust_roughness</atom>
          <atom type="Tooltip">use roughness adjustment attrs: roughness_set, roughness_set_blend, roughness_mult, roughness_remap_{in/out}_{min/max} Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_3 ?">
          <atom type="Label">adjust_specular</atom>
          <atom type="Tooltip">use specular adjustment attrs: specular_set, specular_set_blend, specular_mult Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaAdjustMaterial_1:sheet">
        <atom type="Label">Override</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param1_4 ?">
          <atom type="Label">casts caustics</atom>
          <atom type="Tooltip">allows you to keep or set casts caustics attribute Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_5 ?">
          <atom type="Label">disable_clearcoat</atom>
          <atom type="Tooltip">when checked, turn off clearcoat from input Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_6 ?">
          <atom type="Label">disable_diffuse</atom>
          <atom type="Tooltip">when checked, turn off all diffuse from input Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_7 ?">
          <atom type="Label">disable_specular</atom>
          <atom type="Tooltip">when checked, turn off all specular from input Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_13 ?">
          <atom type="Label">thin geometry</atom>
          <atom type="Tooltip">allows you to keep or set thin geometry attribute Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaAdjustMaterial_2:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param1_8 ?">
          <atom type="Label">emission</atom>
          <atom type="Tooltip">emissive map to add to material's emission Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_9 ?">
          <atom type="Label">emission mode</atom>
          <atom type="Tooltip">how to handle emission input. masked uses mix input, unmasked is mix = 1 Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_11 ?">
          <atom type="Label">mix</atom>
          <atom type="Tooltip">weight of adjustments applied to the material Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param1_12 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Enable/disable all adjustments Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayNative2:sheet">
      <atom type="Label">DwaBaseMaterial</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.filter2</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.editNative">
        <atom type="Label">Material inputs / searchable editor...</atom>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_0:sheet">
        <atom type="Label">Diffuse</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_0 ?">
          <atom type="Label">albedo</atom>
          <atom type="Tooltip">the overall surface color as seen from a distance (ie. diffuse color) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_2 ?">
          <atom type="Label">bssrdf</atom>
          <atom type="Tooltip">0 for NormalizedDiffuse, 1 for Dipole, 2 for random walk Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_12 ?">
          <atom type="Label">crease attenuation</atom>
          <atom type="Tooltip">This mitigates the over-brightening around creases which random walk SSS can cause. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_14 ?">
          <atom type="Label">diffuse roughness</atom>
          <atom type="Tooltip">Roughness of the diffuse shading.  If the value is zero a Lambertian model is used.  If it's above zero the Oren Nayar model is used.   Not compatible with subsurface scattering. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_15 ?">
          <atom type="Label">diffuse transmission</atom>
          <atom type="Tooltip">multiplier on the amount of light that is transmitted through the surface. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_16 ?">
          <atom type="Label">diffuse transmission blending behavior</atom>
          <atom type="Tooltip">Controls how diffuse transmission color attenuates diffuse reflection Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_17 ?">
          <atom type="Label">diffuse transmission color</atom>
          <atom type="Tooltip">the color/amount of light that is transmitted through the surface. Default: Rgb(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_20 ?">
          <atom type="Label">enable sss input normal</atom>
          <atom type="Tooltip">enables sampling the normal map for sss samples. More accurate but potentially expensive Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_77 ?">
          <atom type="Label">resolve self intersections</atom>
          <atom type="Tooltip">tries to resolve self-intersecting geometry automatically by only evaluating 'exiting' intersections for subsurface evaluations Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_79 ?">
          <atom type="Label">scattering color</atom>
          <atom type="Tooltip">the subsurface scattering 'falloff' color Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_80 ?">
          <atom type="Label">scattering radius</atom>
          <atom type="Tooltip">the distance the light scatters beneath the surface. When 0 surface diffuse (lambertian or toon) is used Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_83 ?">
          <atom type="Label">show diffuse</atom>
          <atom type="Tooltip">enables/disables diffuse reflectance Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_1:sheet">
        <atom type="Label">Specular</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_1 ?">
          <atom type="Label">anisotropy</atom>
          <atom type="Tooltip">controls the shape of the primary reflection Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_70 ?">
          <atom type="Label">metallic</atom>
          <atom type="Tooltip">enables/disables metallic model (binary 0|1 for plausibility) Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_71 ?">
          <atom type="Label">metallic color</atom>
          <atom type="Tooltip">the overall reflection color, defines Fresnel behavior Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_72 ?">
          <atom type="Label">metallic edge color</atom>
          <atom type="Tooltip">the reflection color at grazing angles, defines Fresnel behavior Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_76 ?">
          <atom type="Label">refractive index</atom>
          <atom type="Tooltip">defines the Fresnel behavior, (affects reflection and refraction) Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_78 ?">
          <atom type="Label">roughness</atom>
          <atom type="Tooltip">the roughness of the surface (currently only affects reflection) Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_81 ?">
          <atom type="Label">shading tangent</atom>
          <atom type="Tooltip">controls the orientation of anistropy Default: Vec2f(1.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_87 ?">
          <atom type="Label">show specular</atom>
          <atom type="Tooltip">enables/disables specular reflections Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_91 ?">
          <atom type="Label">specular model</atom>
          <atom type="Tooltip">sets the normal distribution function for specular.  GGX is currently isotropic only Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_2:sheet">
        <atom type="Label">Common</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_3 ?">
          <atom type="Label">casts caustics</atom>
          <atom type="Tooltip">allows continuation of caustic light paths. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_75 ?">
          <atom type="Label">presence</atom>
          <atom type="Tooltip">controls the visibility of this object. Useful for fading an object in/out, or to specify a cut-out mask on thin single-sided geometry (eg. a complex leaf texture on a simple card). Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_93 ?">
          <atom type="Label">thin geometry</atom>
          <atom type="Tooltip">enables proper shading of infinitely thin geometry such as paper or leaves. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_3:sheet">
        <atom type="Label">Clearcoat</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_4 ?">
          <atom type="Label">clearcoat</atom>
          <atom type="Tooltip">enables/disables clearcoat (binary 0|1 for plausibility) Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_5 ?">
          <atom type="Label">clearcoat attenuation color</atom>
          <atom type="Tooltip">the attenuation color of the clearcoat when 'cleacoat thickness' &gt; 0 Default: Rgb(0.5f, 0.5f, 0.5f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_6 ?">
          <atom type="Label">clearcoat bending</atom>
          <atom type="Tooltip">(advanced, recommended ON) bends rays based on the clearcoat-refractive-index before evaluating the lobes under clearcoat Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_7 ?">
          <atom type="Label">clearcoat model</atom>
          <atom type="Tooltip">sets the normal distribution function for clearcoat.  GGX is currently isotropic only Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_8 ?">
          <atom type="Label">clearcoat normal dial</atom>
          <atom type="Tooltip">controls the amount of infuence of the alternate clearcoat normal Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_9 ?">
          <atom type="Label">clearcoat refractive index</atom>
          <atom type="Tooltip">defines the Fresnel behavior Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_10 ?">
          <atom type="Label">clearcoat roughness</atom>
          <atom type="Tooltip">the roughness of the clearcoat lobe Default: 0.1f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_11 ?">
          <atom type="Label">clearcoat thickness</atom>
          <atom type="Tooltip">the thickness of the virtual clearcoat layer. Values &gt; 0 enable absorption Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_82 ?">
          <atom type="Label">show clearcoat</atom>
          <atom type="Tooltip">enables/disables clearcoat Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_98 ?">
          <atom type="Label">use independent clearcoat normal</atom>
          <atom type="Tooltip">specifies whether the clearcoat lobe should use an independent normal Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_4:sheet">
        <atom type="Label">Transmission</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_18 ?">
          <atom type="Label">dispersion abbe number</atom>
          <atom type="Tooltip">The amount of dispersion/chromatic-aberration via refractions. Lower this number to increase the effect. A value of 0 turns off dispersion. Around [25-80] makes sense for realistic glass. Lower values may look better on gemstones. Default: 34. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_52 ?">
          <atom type="Label">independent transmission refractive index</atom>
          <atom type="Tooltip">defines a separate IOR for the bending of light with transmission Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_53 ?">
          <atom type="Label">independent transmission roughness</atom>
          <atom type="Tooltip">separate roughness for transmission Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_88 ?">
          <atom type="Label">show transmission</atom>
          <atom type="Tooltip">enables/disables refractive solid model Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_94 ?">
          <atom type="Label">transmission</atom>
          <atom type="Tooltip">enables/disables refractive solid model (binary 0|1 for plausibility) Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_95 ?">
          <atom type="Label">transmission color</atom>
          <atom type="Tooltip">the desired color of transmitted light Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_97 ?">
          <atom type="Label">use dispersion</atom>
          <atom type="Tooltip">use dispersion effects in transmission Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_99 ?">
          <atom type="Label">use independent transmission refractive index</atom>
          <atom type="Tooltip">use a separate IOR for transmission Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_100 ?">
          <atom type="Label">use independent transmission roughness</atom>
          <atom type="Tooltip">use a separate roughness for transmission Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_5:sheet">
        <atom type="Label">Emission</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_19 ?">
          <atom type="Label">emission</atom>
          <atom type="Tooltip">the energy emitted from this material Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_84 ?">
          <atom type="Label">show emission</atom>
          <atom type="Tooltip">enables/disable emission Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_6:sheet">
        <atom type="Label">Fuzz</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_21 ?">
          <atom type="Label">fuzz</atom>
          <atom type="Tooltip">fuzz mask Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_22 ?">
          <atom type="Label">fuzz albedo</atom>
          <atom type="Tooltip">Color of the fuzz highlights. Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_24 ?">
          <atom type="Label">fuzz normal dial</atom>
          <atom type="Tooltip">controls the amount of infuence of the alternate fuzz normal Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_25 ?">
          <atom type="Label">fuzz roughness</atom>
          <atom type="Tooltip">Lower values result in glancing angle highlights while higher values result in a broad, uniform coverage Default: 0.25f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_85 ?">
          <atom type="Label">show fuzz</atom>
          <atom type="Tooltip">Enables/disables fuzz lobe Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_96 ?">
          <atom type="Label">use absorbing fuzz fibers</atom>
          <atom type="Tooltip">Specify whether dark fuzz fibers absorb energy or transmit it to the layers below. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaBaseMaterial_7:sheet">
        <atom type="Label">Glitter</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param2_26 ?">
          <atom type="Label">glitter</atom>
          <atom type="Tooltip">enables/disables glitter model (binary 0|1 for plausibility) Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_27 ?">
          <atom type="Label">glitter LOD quality</atom>
          <atom type="Tooltip">controls quality of glitter at distances where individual flakes cannot be perceived; at lower values, approximation kicks in earlier Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_28 ?">
          <atom type="Label">glitter approximate for secondary rays</atom>
          <atom type="Tooltip">use an approximation to shade glitter for non-mirror secondary rays Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_29 ?">
          <atom type="Label">glitter color A</atom>
          <atom type="Tooltip">base flake color (use physical metallic color values) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_30 ?">
          <atom type="Label">glitter color B</atom>
          <atom type="Tooltip">base flake color (use physical metallic color values) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_31 ?">
          <atom type="Label">glitter color hue variation</atom>
          <atom type="Tooltip">introduce hue variation in flake color centered at the base flake color's hue on the hue wheel Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_32 ?">
          <atom type="Label">glitter color saturation variation</atom>
          <atom type="Tooltip">introduce saturation variation in flake color centered at the base flake color's saturation Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_33 ?">
          <atom type="Label">glitter color value variation</atom>
          <atom type="Tooltip">introduce value variation in flake color centered at the base flake color's value Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param2_34 ?">
          <atom type="Label">glitter compensate reference space deformation</atom>
