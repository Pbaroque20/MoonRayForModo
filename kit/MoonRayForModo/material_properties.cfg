      <list type="Control" val="sub MoonRay_DwaSwitchMaterial_0:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param12_0 ?">
          <atom type="Label">choice</atom>
          <atom type="Tooltip">which of the 64 inputs (0 to 63) to use Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaSwitchMaterial_1:sheet">
        <atom type="Label">Advanced</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param12_1 ?">
          <atom type="Label">fallback bssrdf</atom>
          <atom type="Tooltip">If the two materials disagree on the type of bssrdf, this type will be used instead. Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
