          <atom type="Tooltip">use an approximation to shade glitter for non-mirror secondary rays Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_16 ?">
          <atom type="Label">glitter color A</atom>
          <atom type="Tooltip">base flake color (use physical metallic color values) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_17 ?">
          <atom type="Label">glitter color B</atom>
          <atom type="Tooltip">base flake color (use physical metallic color values) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_18 ?">
          <atom type="Label">glitter color hue variation</atom>
          <atom type="Tooltip">introduce hue variation in flake color centered at the base flake color's hue on the hue wheel Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_19 ?">
          <atom type="Label">glitter color saturation variation</atom>
          <atom type="Tooltip">introduce saturation variation in flake color centered at the base flake color's saturation Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_20 ?">
          <atom type="Label">glitter color value variation</atom>
          <atom type="Tooltip">introduce value variation in flake color centered at the base flake color's value Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_21 ?">
          <atom type="Label">glitter compensate reference space deformation</atom>
          <atom type="Tooltip">(In ReferenceSpace) Compensates for stretch/compression/shear in glitter shapes resulting from animation etc Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_22 ?">
          <atom type="Label">glitter debug mode</atom>
          <atom type="Tooltip">developer debug visualization modes Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_23 ?">
          <atom type="Label">glitter density</atom>
          <atom type="Tooltip">controls the number of flakes per unit length; larger density packs more flakes into same space Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_24 ?">
          <atom type="Label">glitter jitter</atom>
          <atom type="Tooltip">Controls how much the flakes are randomly offset from a regular grid Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_25 ?">
          <atom type="Label">glitter layering mode</atom>
          <atom type="Tooltip">layering mode for glitter on top of the under material. physical: conserves energy and glitter attenuates under material, additive: breaks energy conservation but glitter is never darker than the under material (eg. use case: snow) Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_26 ?">
          <atom type="Label">glitter randomness</atom>
          <atom type="Tooltip">randomness of flake orientation Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_27 ?">
          <atom type="Label">glitter roughness A</atom>
          <atom type="Tooltip">specular roughness of individual flakes (0 makes flakes mirror-like) Default: 0.14f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_28 ?">
          <atom type="Label">glitter roughness B</atom>
          <atom type="Tooltip">specular roughness of individual flakes (0 makes flakes mirror-like) Default: 0.14f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_29 ?">
          <atom type="Label">glitter seed</atom>
          <atom type="Tooltip">The seed for the glitter random number generator Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_30 ?">
          <atom type="Label">glitter size A</atom>
          <atom type="Tooltip">size of the flakes.  Apparent flake size may vary based on how much the flake spheres intersect the surface Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_31 ?">
          <atom type="Label">glitter size B</atom>
          <atom type="Tooltip">size of the flakes.  Apparent flake size may vary based on how much the flake spheres intersect the surface Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_32 ?">
          <atom type="Label">glitter space</atom>
          <atom type="Tooltip">The space to calculate the worley noise in, defaults to reference space Default: 5. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_33 ?">
          <atom type="Label">glitter style A frequency</atom>
          <atom type="Tooltip">0 implies none of this style, 1 implies all the flakes will get this style Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_34 ?">
          <atom type="Label">glitter style B frequency</atom>
          <atom type="Tooltip">0 implies none of this style, 1 implies all the flakes will get this style Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_35 ?">
          <atom type="Label">glitter texture A</atom>
          <atom type="Tooltip">filename that points to a texture .exr or .tx file (must be mip-mapped and tiled with maketx). Default: . Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_36 ?">
          <atom type="Label">glitter texture B</atom>
          <atom type="Tooltip">filename that points to a texture .exr or .tx file (must be mip-mapped and tiled with maketx). Default: . Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_37 ?">
          <atom type="Label">glitter texture orientation randomness</atom>
          <atom type="Tooltip">randomly orient each texture Default: 0.15f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_44 ?">
          <atom type="Label">show glitter</atom>
          <atom type="Tooltip">Enables/disables glitter lobes Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaFabricMaterial_5:sheet">
        <atom type="Label">Normal</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param5_39 ?">
          <atom type="Label">input normal dial</atom>
          <atom type="Tooltip">controls the amount of influence of the alternate normal Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaFabricMaterial_6:sheet">
        <atom type="Label">Fabric</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param5_45 ?">
          <atom type="Label">show specular</atom>
          <atom type="Tooltip">Enables/disables specular fabric lobes Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_47 ?">
          <atom type="Label">use UVs for thread direction</atom>
          <atom type="Tooltip">Use UV texture coordinates to compute thread direction (along dPds). Switch OFF for seamless camera aligned thread direction.  The warp_thread_direction parameter rotates this direction in tangent space. Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_49 ?">
          <atom type="Label">use independent weft attributes</atom>
          <atom type="Tooltip">Use a separate set of attributes for the 'weft' thread specular response. Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_50 ?">
          <atom type="Label">warp color</atom>
          <atom type="Tooltip">Color of the fabric specular highlights. Or if 'use independent weft attributes' is 'true,' just the color of the fabric specular highlights of the warp threads. Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_51 ?">
          <atom type="Label">warp roughness</atom>
          <atom type="Tooltip">Roughness of the fabric specular highlights. Or if 'use independent weft attributes' is 'true,' just the roughness of the fabric specular highlights of the warp threads. Default: 0.75f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_55 ?">
          <atom type="Label">weft color</atom>
          <atom type="Tooltip">Color of the fabric specular highlights from the weft threads. Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_56 ?">
          <atom type="Label">weft roughness</atom>
          <atom type="Tooltip">Roughness of the fabric specular highlights from the weft threads. Default: 0.75f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaFabricMaterial_7:sheet">
        <atom type="Label">Threads</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param5_52 ?">
          <atom type="Label">warp thread coverage</atom>
          <atom type="Tooltip">When set to 1, creates specular highlights only relative to the warp thread direction. When less than one, starts acting like a 'woven' fabric with specular contributions added in by a corresponding 'weft' thread direction, perpendicular to the 'warp' thread direction. Default: 0.75. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_53 ?">
          <atom type="Label">warp thread direction</atom>
          <atom type="Tooltip">Direction of the major/warp thread for the fabric. The fabric highlights will be relative to this direction. Default: Vec3f(1.0f, 1.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param5_54 ?">
          <atom type="Label">warp thread elevation</atom>
          <atom type="Tooltip">This attribute can be used to 'elevate/rotate' the threads from their default direction. When laying flat on the surface (thread_direction.z=0), a value around 45 works well for 'silky' looks. Range - -90, +90. When threads are upright (thread_direction.z=1), this attribute can be used to 'dishevel' the threads and create a 'velvety' look (see wiki). Default: 0.0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
    </hash>
