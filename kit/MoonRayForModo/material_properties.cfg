        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaRefractiveMaterial_7:sheet">
        <atom type="Label">Iridescence</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param9_23 ?">
          <atom type="Label">iridescence</atom>
          <atom type="Tooltip">controls the strength of the iridescence effect Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_24 ?">
          <atom type="Label">iridescence apply to</atom>
          <atom type="Tooltip">Apply iridescence to primary specular lobe or clearcoat/moisture lobe Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_25 ?">
          <atom type="Label">iridescence at 0 incidence</atom>
          <atom type="Tooltip">Iridescence effect at 0 degree viewing angle Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_26 ?">
          <atom type="Label">iridescence at 90 incidence</atom>
          <atom type="Tooltip">Iridescence effect at 90 degree viewing angle Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_27 ?">
          <atom type="Label">iridescence color control</atom>
          <atom type="Tooltip">use hue interpolation: automatically cycles through hue wheel, use ramp: user specified color ramp Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_28 ?">
          <atom type="Label">iridescence_colors</atom>
          <atom type="Tooltip">List of colors on the ramp Default: {Rgb(1.0, 0.0, 0.0), Rgb(1.0, 1.0, 0.0), Rgb(0.0, 1.0, 0.0), Rgb(0.0, 1.0, 1.0), Rgb(0.0, 0.0, 1.0), Rgb(1.0, 0.0, 1.0), Rgb(1.0, 0.0, 0.0)}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_29 ?">
          <atom type="Label">iridescence exponent</atom>
          <atom type="Tooltip">Tightens or broadens the distribution of colors Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_30 ?">
          <atom type="Label">iridescence flip hue direction</atom>
          <atom type="Tooltip">flip interpolation around the hue wheel to counter-clockwise direction Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_31 ?">
          <atom type="Label">iridescence_interpolations</atom>
          <atom type="Tooltip">None: 0 | Linear: 1 | Exponential Up: 2 | Exponential Down: 3 |\n\t\t\tSmooth: 4 | Catmull Rom: 5 | Monotone Cubic: 6 Default: {4, 4, 4, 4, 4, 4, 4}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_32 ?">
          <atom type="Label">iridescence_positions</atom>
          <atom type="Tooltip">ramp positions Default: {0.0, 0.167, 0.333, 0.5, 0.667, 0.833, 1.0}. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_33 ?">
          <atom type="Label">iridescence primary color</atom>
          <atom type="Tooltip">First color to interpolate from around the hue wheel Default: Rgb(1.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_34 ?">
          <atom type="Label">iridescence ramp interpolation mode</atom>
          <atom type="Tooltip">RGB: lerp in RGB space which matches UI preview but can lose saturation, HSV: lerp in HSV space which preserves saturation Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_35 ?">
          <atom type="Label">iridescence secondary color</atom>
          <atom type="Tooltip">Second color to interpolate to around the hue wheel Default: Rgb(1.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_36 ?">
          <atom type="Label">iridescence thickness</atom>
          <atom type="Tooltip">Controls how much the color spectrum is repeated Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaRefractiveMaterial_8:sheet">
        <atom type="Label">Normal Anti-aliasing</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param9_37 ?">
          <atom type="Label">normal AA dial</atom>
          <atom type="Tooltip">Controls the amount roughness compensation from the normal map AA strategy. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param9_38 ?">
          <atom type="Label">normal AA strategy</atom>
          <atom type="Tooltip">Normal map anti-aliasing strategy to use - 'none' uses regular mip-mapping, 'toksvig' increases specular roughness corresponding to the geometric details filtered out because of mip-mapping. Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRay_DwaRefractiveMaterial_9:sheet">
        <atom type="Label">Advanced</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param9_48 ?">
          <atom type="Label">specular</atom>
          <atom type="Tooltip">enables/disables specular reflections (binary 0|1 for plausibility) Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayNative10:sheet">
      <atom type="Label">DwaSkinMaterial</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.filter10</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.editNative">
        <atom type="Label">Material inputs / searchable editor...</atom>
      </list>
      <list type="Control" val="sub MoonRay_DwaSkinMaterial_0:sheet">
        <atom type="Label">Diffuse</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.material.param10_0 ?">
          <atom type="Label">albedo</atom>
          <atom type="Tooltip">the overall surface color as seen from a distance (ie. diffuse color) Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_2 ?">
          <atom type="Label">bssrdf</atom>
          <atom type="Tooltip">0 for NormalizedDiffuse, 1 for Dipole, 2 for random walk Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_4 ?">
          <atom type="Label">crease attenuation</atom>
          <atom type="Tooltip">This mitigates the over-brightening around creases which random walk SSS can cause. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_6 ?">
          <atom type="Label">diffuse roughness</atom>
          <atom type="Tooltip">Roughness of the diffuse shading.  If the value is zero a Lambertian model is used.  If it's above zero the Oren Nayar model is used.   Not compatible with subsurface scattering. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_7 ?">
          <atom type="Label">diffuse transmission</atom>
          <atom type="Tooltip">multiplier on the amount of light that is transmitted through the surface. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_8 ?">
          <atom type="Label">diffuse transmission blending behavior</atom>
          <atom type="Tooltip">Controls how diffuse transmission color attenuates diffuse reflection Default: 1. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_9 ?">
          <atom type="Label">diffuse transmission color</atom>
          <atom type="Tooltip">the color/amount of light that is transmitted through the surface. Default: Rgb(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_11 ?">
          <atom type="Label">enable sss input normal</atom>
          <atom type="Tooltip">enables sampling the normal map for sss samples. More accurate but potentially expensive Default: false. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_68 ?">
          <atom type="Label">resolve self intersections</atom>
          <atom type="Tooltip">tries to resolve self-intersecting geometry automatically by only evaluating 'exiting' intersections for subsurface evaluations Default: true. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_70 ?">
          <atom type="Label">scattering color</atom>
          <atom type="Tooltip">the subsurface scattering 'falloff' color Default: Rgb(1.0f, 1.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_71 ?">
          <atom type="Label">scattering radius</atom>
          <atom type="Tooltip">the distance the light scatters beneath the surface. When 0 surface diffuse (lambertian or toon) is used Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param10_73 ?">
          <atom type="Label">show diffuse</atom>
