          <atom type="Tooltip">Index of Refraction to be used for translucent objects and objects with specular components, including the clearcoat if clearcoat &gt; 0. Default: 1.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_6 ?">
          <atom type="Label">metallic</atom>
          <atom type="Tooltip">Use 1 for metallic surfaces and 0 for non-metallic.  If metallic is 1, then both F0 (reflectivity at 0 degree incidence) and edge F90 reflectivity will simply be the Albedo.  If metallic is 0, then Albedo is ignored in the calculation of F0 and F90; F0 is derived from ior via ( (1-ior)/(1+ior) )^2 and F90 is white. In between, we interpolate. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_7 ?">
          <atom type="Label">normal</atom>
          <atom type="Tooltip">Expects normal in tangent space [(-1,-1,-1), (1,1,1)] Default: Vec3f(0.0f, 0.0f, 1.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_8 ?">
          <atom type="Label">occlusion</atom>
          <atom type="Tooltip">Ignored by Moonray Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_9 ?">
          <atom type="Label">opacity</atom>
          <atom type="Tooltip">When opacity is 1.0 then the geometry is fully opaque, if it is smaller than 1.0 then the geometry is translucent, when it is 0 the geometry is transparent. Note that even a fully transparent object still receives lighting as, for example, perfectly clear glass still has a specular response. Default: 1.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_10 ?">
          <atom type="Label">opacityThreshold</atom>
          <atom type="Tooltip">The opacityThreshold input is useful for creating geometric cut-outs based on the opacity input. A value of 0.0 indicates that no masking is applied to the opacity input, while a value greater than 0.0 indicates that rendering of the surface is limited to the areas where the opacity is greater or equal to that value. Default: 0.0f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_11 ?">
          <atom type="Label">roughness</atom>
          <atom type="Tooltip">Roughness for the specular lobe. The value ranges from 0 to 1, which goes from a perfectly specular surface at 0.0 to maximum roughness of the specular lobe. Default: 0.5f. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_12 ?">
          <atom type="Label">specularColor</atom>
          <atom type="Tooltip">Specular color to be used. This is the color at 0 incidence. Edge color is assumed white. Transition between the two colors according to Schlick fresnel approximation. Default: Rgb(0.0f, 0.0f, 0.0f). Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.material.param24_13 ?">
          <atom type="Label">useSpecularWorkflow</atom>
          <atom type="Tooltip">This node can fundamentally operate in two modes : Specular workflow where you provide a texture/value to the 'specularColor' input. Or, Metallic workflow where you provide a texture/value to the 'metallic' input. Default: 0. Blank/Default uses native value. Arrays and vectors use JSON [x, y, z].</atom>
        </list>
      </list>
    </hash>
  </atom>
</configuration>