<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <!-- Export as MoonRay Scene, in the MoonRay menu (layout.cfg) and the preview window's Options menu. It is not in
       Modo's File menu: a kit can add to that menu only at its start or its end, and a kit's own File menu takes the
       place of Modo's whole. -->
  <atom type="CommandHelp">
    <hash type="Command" key="moonray.scene.export@en_US">
      <atom type="UserName">Export as MoonRay Scene</atom>
      <atom type="ButtonName">Export as MoonRay Scene...</atom>
      <atom type="Tooltip">The scene as MoonRay reads it, as RDLA, RDLB or both, to render with MoonRay or on a farm</atom>
    </hash>
  </atom>
</configuration>
