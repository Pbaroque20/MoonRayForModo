<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <!-- Convert LXO to RDL, which took the place of Export as MoonRay Scene: moonray.lxo.convert in the MoonRay menu
       (layout.cfg) and the preview window's Options; moonray.scene.export, the old command, opens it too. -->
  <atom type="CommandHelp">
    <hash type="Command" key="moonray.lxo.convert@en_US">
      <atom type="UserName">Convert LXO to RDL</atom>
      <atom type="ButtonName">Convert LXO to RDL...</atom>
      <atom type="Tooltip">Modo scenes written as MoonRay scenes (RDLA, RDLB or both) in the background, the scene open now among them, to render with MoonRay or on a farm</atom>
    </hash>
    <hash type="Command" key="moonray.scene.export@en_US">
      <atom type="UserName">Convert LXO to RDL</atom>
      <atom type="ButtonName">Convert LXO to RDL...</atom>
      <atom type="Tooltip">Modo scenes written as MoonRay scenes (RDLA, RDLB or both) in the background, the scene open now among them, to render with MoonRay or on a farm</atom>
    </hash>
  </atom>
</configuration>
