<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <atom type="Attributes">
    <!-- File menu: Export as MoonRay Scene, a sheet of its own placed in Modo's File menu (69223020078:sheet) at its
         end. Modo's File menu is not defined again here: a sheet of the same key takes its place, and the menu loses
         everything else. -->
    <hash type="Sheet" key="MoonRayFileMenu:sheet">
      <atom type="Label">MoonRay Scene</atom>
      <atom type="Export">0</atom>
      <atom type="Filter"></atom>
      <atom type="Layout">properties</atom>
      <atom type="Columns">1</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <hash type="InCategory" key="69223020078:sheet#tail">
        <atom type="Ordinal">90</atom>
      </hash>
      <atom type="Group"></atom>
      <list type="Control" val="div ">
        <atom type="Alignment">full</atom>
      </list>
      <list type="Control" val="cmd moonray.scene.export">
        <atom type="Label">Export as MoonRay Scene...</atom>
        <atom type="Tooltip">The scene as MoonRay reads it, as RDLA, RDLB or both, to render with MoonRay or on a farm</atom>
        <atom type="Hash">MoonRayFile_export_scene:control</atom>
      </list>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Command" key="moonray.scene.export@en_US">
      <atom type="UserName">Export as MoonRay Scene</atom>
      <atom type="ButtonName">Export as MoonRay Scene...</atom>
      <atom type="Tooltip">The scene as MoonRay reads it, as RDLA, RDLB or both, to render with MoonRay or on a farm</atom>
    </hash>
  </atom>
</configuration>
