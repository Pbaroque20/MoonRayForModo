    <hash type="Sheet" key="MoonShineLegacyProperties:sheet">
      <atom type="Label">MoonShine — Modo Controls</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.filter0</atom>
      <list type="Control" val="cmd moonray.material.enable ?">
        <atom type="Label">Use Modo Controls (resets native type)</atom>
      </list>
      <list type="Control" val="cmd item.channel advancedMaterial$diffCol ?">
        <atom type="Label">Base Color</atom>
      </list>
      <list type="Control" val="cmd item.channel advancedMaterial$diffAmt ?">
        <atom type="Label">Diffuse Amount</atom>
      </list>
      <list type="Control" val="cmd item.channel advancedMaterial$metallic ?">
        <atom type="Label">Metalness</atom>
      </list>
      <list type="Control" val="cmd item.channel advancedMaterial$rough ?">
        <atom type="Label">Reflection Roughness</atom>
      </list>
      <list type="Control" val="cmd moonray.native.open">
