    <hash type="Sheet" key="MoonRayMaterialXOverrideProperties:sheet">
      <atom type="Label">MaterialX Override</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">item.withTypeIsSelected material.moonrayMaterialX testSupertypes:true</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">129</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.materialxOverride ?">
        <atom type="Label">Enable MaterialX Override</atom>
      </list>
      <list type="Control" val="cmd moonray.material.editMaterialX">
        <atom type="Label">Edit Node Graph...</atom>
      </list>
    </hash>
  </atom>
  <atom type="Frame">
    <hash type="Layout" key="base.MoonRayForModoLayout" val="applicationLayout">
      <atom type="IdealSize">1000 720</atom>
      <list type="Port">customview 0 1 0 1 MoonRayForModoViewport</list>
      <atom type="UserName">MoonRay Preview</atom>
    </hash>
    <hash type="customview" key="base.MoonRayForModoViewport" val="listed">
      <atom type="Identifier">MoonRayForModo:customview</atom>
      <atom type="Server">MoonRayForModoPreview</atom>
      <atom type="ViewportTitle">MoonRay Preview</atom>
      <atom type="ViewportClass">vpapplication</atom>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Command" key="moonray.open@en_US">
      <atom type="UserName">MoonRay Preview</atom>
      <atom type="ButtonName">MoonRay Preview</atom>
      <atom type="Tooltip">Open the native Windows MoonRay preview panel.</atom>
    </hash>
  </atom>
</configuration>