<?xml version='1.0' encoding='utf-8'?>
<configuration>
  <atom type="Attributes">
    <hash type="Sheet" key="MoonRayForModoMenu:sheet">
      <atom type="Label">MoonRay</atom>
      <atom type="Style">forcetabs</atom>
      <atom type="Layout">properties</atom>
      <atom type="Group">menubar/menus</atom>
      <hash type="InCategory" key="menubar#tail">
        <atom type="Ordinal">100</atom>
      </hash>
      <list type="Control" val="cmd moonray.page render">
        <atom type="Label">Render Setup</atom>
        <atom type="Hash">MoonRayMenu_render:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page preview">
        <atom type="Label">Open Live Preview</atom>
        <atom type="Hash">MoonRayMenu_preview:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page object">
        <atom type="Label">Object Properties</atom>
        <atom type="Hash">MoonRayMenu_object:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page lighting">
        <atom type="Label">Shading and Lighting</atom>
        <atom type="Hash">MoonRayMenu_lighting:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page aovs">
        <atom type="Label">Render Passes (AOVs)</atom>
        <atom type="Hash">MoonRayMenu_aovs:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page system">
        <atom type="Label">Runtime and CPU</atom>
        <atom type="Hash">MoonRayMenu_system:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page final">
        <atom type="Label">Render EXR…</atom>
        <atom type="Hash">MoonRayMenu_final:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page export">
        <atom type="Label">Export MoonRay Scene…</atom>
        <atom type="Hash">MoonRayMenu_export:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page stop">
        <atom type="Label">Stop Rendering</atom>
        <atom type="Hash">MoonRayMenu_stop:control</atom>
      </list>
      <list type="Control" val="cmd moonray.page log">
        <atom type="Label">Render Log</atom>
        <atom type="Hash">MoonRayMenu_log:control</atom>
      </list>
      <list type="Control" val="cmd moonray.dock">
        <atom type="Label">Use MoonRay in Current Viewport</atom>
      </list>
      <list type="Control" val="cmd moonray.material.assign">
        <atom type="Label">Assign MoonShine Material to Mesh</atom>
      </list>
      <list type="Control" val="cmd moonray.material.nodeOverride">
        <atom type="Label">Add MaterialX Override</atom>
      </list>
      <list type="Control" val="cmd moonray.about">
        <atom type="Label">About MoonRay for Modo...</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayMeshProperties:sheet">
      <atom type="Label">MoonRay</atom>
      <atom type="Filter">Meshes</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">128</atom>
      </hash>
      <list type="Control" val="cmd moonray.object.override ?">
        <atom type="Label">Use Object Overrides</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1–5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.subdivision ?">
        <atom type="Label">Subdivide in MoonRay</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1–5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.level ?">
        <atom type="Label">Subdivision Level</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1–5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.smooth ?">
        <atom type="Label">Smooth Shading</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1–5. Applies to selected meshes and supports Undo.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonShineMaterialProperties:sheet">
      <atom type="Label">MoonShine Material</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.regularFilter</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">129</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.type ?">
        <atom type="Label">Material type</atom>
      </list>
      <list type="Control" val="ref MoonShineLegacyProperties:sheet">
        <atom type="ShowLabel">0</atom>
      </list>
      <list type="Control" val="ref MoonRayNative1:sheet">
