    <hash type="Sheet" key="MoonRayMeshProperties:sheet">
      <atom type="Label">MoonRay</atom>
      <atom type="FilterCommand">moonray.object.filter</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">128</atom>
      </hash>
      <list type="Control" val="cmd moonray.object.override ?">
        <atom type="Label">Use Object Overrides</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1-5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.subdivision ?">
        <atom type="Label">Subdivide in MoonRay</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1-5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.level ?">
        <atom type="Label">Subdivision Level</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1-5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.smooth ?">
        <atom type="Label">Smooth Shading</atom>
        <atom type="Tooltip">Settings are saved with this mesh. Enable object overrides to use them. Subdivision level is 1-5. Applies to selected meshes and supports Undo.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.share_instances ?"><atom type="Label">Share Replica / Instance Geometry</atom></list>
      <list type="Control" val="cmd moonray.object.dynamic_tessellation ?"><atom type="Label">Camera-Adaptive Subdivision (expands instances)</atom><atom type="Tooltip">Uses the screen error in pixels, or 2 pixels when zero. Expands subdivision instances for camera-dependent tessellation, increasing memory. Evaluated polygons retain Modo tessellation.</atom></list>
      <list type="Control" val="cmd moonray.object.normal_override ?"><atom type="Label">Override Normals by Angle</atom><atom type="Tooltip">Requires object overrides. Angular density is an estimate capped by subdivision level. Evaluated meshes keep Modo tessellation. Smoothing affects polygon normals, not subdivision creases.</atom></list>
      <list type="Control" val="cmd moonray.object.smoothing_angle ?"><atom type="Label">Smoothing Angle (degrees)</atom><atom type="Tooltip">Requires object overrides. Angular density is an estimate capped by subdivision level. Evaluated meshes keep Modo tessellation. Smoothing affects polygon normals, not subdivision creases.</atom></list>
      <list type="Control" val="cmd moonray.object.angular_tessellation ?"><atom type="Label">Estimate Subdivision Density from Angle</atom><atom type="Tooltip">Requires object overrides. Angular density is an estimate capped by subdivision level. Evaluated meshes keep Modo tessellation. Smoothing affects polygon normals, not subdivision creases.</atom></list>
      <list type="Control" val="cmd moonray.object.tessellation_angle ?"><atom type="Label">Target Face Angle (degrees, estimated)</atom><atom type="Tooltip">Requires object overrides. Angular density is an estimate capped by subdivision level. Evaluated meshes keep Modo tessellation. Smoothing affects polygon normals, not subdivision creases.</atom></list>
      <list type="Control" val="cmd moonray.object.adaptive_error ?"><atom type="Label">Subdivision Screen Error (pixels)</atom><atom type="Tooltip">Requires object overrides. Angular density is an estimate capped by subdivision level. Evaluated meshes keep Modo tessellation. Smoothing affects polygon normals, not subdivision creases.</atom></list>
      <list type="Control" val="cmd moonray.object.curves ?"><atom type="Label">Render Curves as Tubes</atom><atom type="Tooltip">Requires object overrides. Curves, splines and line polygons of this mesh render as round tubes, all of one material as a single curve geometry.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_root_width ?"><atom type="Label">Curve Width at Root (mm)</atom><atom type="Tooltip">The width of each strand where it starts.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_tip_width ?"><atom type="Label">Curve Width at Tip (mm)</atom><atom type="Tooltip">The width of each strand where it ends. Zero comes to a point.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_envelope ?"><atom type="Label">Curve Envelope</atom><atom type="Tooltip">How the width goes from root to tip along the length: 1 is an even taper, higher keeps the root width for longer, lower thins early.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_samples ?"><atom type="Label">Samples per Curve Bend</atom><atom type="Tooltip">How finely a spline is followed. Line polygons are used as they are.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_uv ?"><atom type="Label">Curve UVs along Length</atom><atom type="Tooltip">Gives each strand UVs for textures: V runs 0 at the root to 1 at the tip by length, U tells the strands apart.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_basis ?"><atom type="Label">Line Points Are</atom><atom type="Tooltip">The line itself: strands run from point to point. Bezier or B-spline control points: MoonRay draws a smooth curve from them, which a B-spline does not pass through. A curve from a MoonRay scene comes in this way.</atom></list>
      <list type="Control" val="cmd moonray.object.curve_round ?"><atom type="Label">Round Curves</atom><atom type="Tooltip">Renders each strand as a true tube, with a tube's shading across its width. Off, strands are flat ribbons that turn to face the view: quicker, and the same to look at when they are as thin as hair.</atom></list>
      <list type="Control" val="cmd moonray.object.hair ?"><atom type="Label">Grow Hair from Curves</atom><atom type="Tooltip">Requires object overrides. The curves of this mesh become guides: many strands are grown from each when the scene is rendered. They take the curve widths above, made thinner where needed to keep the strands of a cluster apart.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_scalp ?"><atom type="Label">Hair Scalp</atom><atom type="Tooltip">The mesh the hair grows on. Every root is held to its surface, so no strand floats above it or starts inside it.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_mode ?"><atom type="Label">Hair Grows</atom><atom type="Tooltip">Around each guide: strands follow that guide and gather toward it, as locks. Between guides: each strand is shaped by the guides nearest it and fills the space between them, as fur.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_count ?"><atom type="Label">Strands per Guide</atom><atom type="Tooltip">How many strands are grown from each guide.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_width ?"><atom type="Label">Cluster Width at Root (mm)</atom><atom type="Tooltip">How far from its guide a strand may start. 0 sizes it from the guides: a sixth of their length.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_clump ?"><atom type="Label">Cluster Closes toward Tip</atom><atom type="Tooltip">Around each guide: 0 keeps the strands as far apart as at the root, 1 brings them to the guide at its tip.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_length ?"><atom type="Label">Length Variation</atom><atom type="Tooltip">How much shorter than its guide a strand may be: 0 for none, 0.3 for up to 30%.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_seed ?"><atom type="Label">Hair Seed</atom><atom type="Tooltip">Another number grows other hair from the same guides. The same number always grows the same hair.</atom></list>
      <list type="Control" val="cmd moonray.object.hair_guides ?"><atom type="Label">Render Guides Too</atom><atom type="Tooltip">Render the guide curves themselves along with the hair grown from them.</atom></list>
    </hash>
