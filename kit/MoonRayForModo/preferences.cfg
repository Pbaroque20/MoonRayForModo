<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <!-- A MoonRay page in Modo's own Preferences (System > Preferences). -->
  <atom type="Attributes">
    <hash type="Sheet" key="MoonRayPreferences:sheet">
      <atom type="Label">MoonRay (2026.29.1)</atom>
      <!-- The properties layout draws each sub-sheet as a section that folds, as the MoonRay render settings do. -->
      <atom type="Layout">properties</atom>
      <list type="Control" val="sub MoonRayPreviewWindow:sheet">
        <atom type="Label">Preview Window</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayPreviewWindow:sheet</atom>
      </list>
      <list type="Control" val="sub MoonRayLighting:sheet">
        <atom type="Label">Lighting</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayLighting:sheet</atom>
      </list>
      <list type="Control" val="sub MoonRayAssignMaterial:sheet">
        <atom type="Label">Assign Material</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayAssignMaterial:sheet</atom>
      </list>
      <atom type="Filter">prefs/moonray/general:filterPreset</atom>
      <hash type="InCategory" key="prefs:general#head">
        <atom type="Ordinal">80.6</atom>
      </hash>
      <atom type="Group">prefs/moonray</atom>
    </hash>
    <!-- Pages of their own beside General, each in the Preferences list under MoonRay: the renderer, its graphics card
         mode (XPU) and the plugin's changes to MoonRay. -->
    <hash type="Sheet" key="MoonRayRendererPage:sheet">
      <atom type="Label">Renderer</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="sub MoonRayRenderer:sheet">
        <atom type="Label">Renderer</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayRenderer:sheet</atom>
      </list>
      <atom type="Filter">prefs/moonray/renderer:filterPreset</atom>
      <hash type="InCategory" key="prefs:general#head">
        <atom type="Ordinal">80.61</atom>
      </hash>
      <atom type="Group">prefs/moonray</atom>
    </hash>
    <hash type="Sheet" key="MoonRayXPUPage:sheet">
      <atom type="Label">XPU</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="sub MoonRayXPU:sheet">
        <atom type="Label">XPU (graphics card)</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayXPU:sheet</atom>
      </list>
      <atom type="Filter">prefs/moonray/xpu:filterPreset</atom>
      <hash type="InCategory" key="prefs:general#head">
        <atom type="Ordinal">80.62</atom>
      </hash>
      <atom type="Group">prefs/moonray</atom>
    </hash>
    <hash type="Sheet" key="MoonRaySourceOverridesPage:sheet">
      <atom type="Label">Source Overrides</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="sub MoonRaySourceOverrides:sheet">
        <atom type="Label">MoonRay Source Overrides</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRaySourceOverrides:sheet</atom>
      </list>
      <atom type="Filter">prefs/moonray/overrides:filterPreset</atom>
      <hash type="InCategory" key="prefs:general#head">
        <atom type="Ordinal">80.63</atom>
      </hash>
      <atom type="Group">prefs/moonray</atom>
    </hash>
    <!-- MoonRay on the graphics card. -->
    <hash type="Sheet" key="MoonRayXPU:sheet">
      <atom type="Label">XPU (graphics card)</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.autoXpu ?">
        <atom type="Label">Auto renders on the graphics card first</atom>
        <atom type="Tooltip">The Auto execution mode starts on the graphics card (XPU), falling back to the processor where the scene has what XPU does not support. Off, as MoonRay itself does: Auto renders on the processor (vector). It takes effect when the next render starts</atom>
      </list>
    </hash>
    <!-- How the preview window opens and draws. -->
    <hash type="Sheet" key="MoonRayPreviewWindow:sheet">
      <atom type="Label">Preview Window</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.engine ?">
        <atom type="Label">Preview engine</atom>
        <atom type="Tooltip">The engine a preview window opens on: MoonRay for full renders, MoonRay LS (low sample) for quick ones, or MoonLightIPR to follow the scene. The window opens showing the crest and renders nothing until asked</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.renderOnOpen ?">
        <atom type="Label">Render when the window opens</atom>
        <atom type="Tooltip">Start a preview as soon as the preview window opens</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.noticesOpen ?">
        <atom type="Label">Open Notices when there are any</atom>
        <atom type="Tooltip">Show the Notices panel by itself whenever the renderer has something to say about the scene</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.draftInk ?">
        <atom type="Label">Draft lines</atom>
        <atom type="Tooltip">The colour of a draft's outlines. It shows the next time the draft is drawn</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.draftWidth ?">
        <atom type="Label">Draft quick width</atom>
        <atom type="Tooltip">How many pixels wide a draft's first, quick picture is. The fine picture that follows it is as fine as the view</atom>
      </list>
    </hash>
    <!-- How the scene is lit, and new lights. -->
    <hash type="Sheet" key="MoonRayLighting:sheet">
      <atom type="Label">Lighting</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.environmentLighting ?">
        <atom type="Label">Environment lights the scene</atom>
        <atom type="Tooltip">MoonRay: the environment always lights the scene, as a path tracer has it. Follow Modo: it lights the scene only when Global Illumination is on in the Render item, as in Modo's own renders; it is still seen as the backdrop and in reflections</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.lightIntensity ?">
        <atom type="Label">New light intensity</atom>
        <atom type="Tooltip">How bright a newly created MoonRay light starts, from either Add Item or the MoonRay menu</atom>
      </list>
    </hash>
    <!-- What the Assign Material dialog starts with, and its key. -->
    <hash type="Sheet" key="MoonRayAssignMaterial:sheet">
      <atom type="Label">Assign Material</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.assignKey ?">
        <atom type="Label">M key opens Assign Material (after restarting Modo)</atom>
        <atom type="Tooltip">With this on, the M key opens MoonRay's Assign Material in place of Modo's own, from the next time Modo starts. Switch it off to give the key back to Modo's</atom>
        <atom type="Hash">MoonRayPreferences_assignKey:control</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.assignType ?">
        <atom type="Label">Starting type</atom>
        <atom type="Tooltip">The kind of MoonRay material the Assign Material dialog starts on</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.assignSmooth ?">
        <atom type="Label">Smooth across edges</atom>
        <atom type="Tooltip">Whether the Assign Material dialog starts with smoothing on</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.assignAngle ?">
        <atom type="Label">Smoothing angle</atom>
        <atom type="Tooltip">The smoothing angle the Assign Material dialog starts with, in degrees</atom>
      </list>
    </hash>
    <!-- Where MoonRay is, and the memory it keeps between renders. -->
    <hash type="Sheet" key="MoonRayRenderer:sheet">
      <atom type="Label">Renderer</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.workingSpace ?">
        <atom type="Label">Render working space</atom>
        <atom type="Tooltip">The colour primaries MoonRay renders in, for every scene that has not chosen its own in the Assets window: linear Rec.709 (sRGB's) or ACEScg</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.runtime ?">
        <atom type="Label">Runtime folder</atom>
        <atom type="Tooltip">Where the MoonRay runtime is. Leave it empty for the one that came with the kit</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.runtimeBrowse">
        <atom type="Label">Choose Runtime Folder...</atom>
        <atom type="Tooltip">Choose the folder of the MoonRay runtime</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.idleRelease ?">
        <atom type="Label">Release idle renderer memory</atom>
        <atom type="Tooltip">Free memory after a completed or paused preview. Cached images remain available; the next render reloads its scene. Active renders are not interrupted</atom>
      </list>
      <list type="Control" val="cmd moonray.releaseIdle">
        <atom type="Label">Release Idle Renderer Memory Now</atom>
      </list>
    </hash>
    <!-- Where the plugin changes how MoonRay itself renders, each on by default; off renders as MoonRay's source does. In order: how
         MoonRay runs, shading, motion, then fog and Cryptomatte. -->
    <hash type="Sheet" key="MoonRaySourceOverrides:sheet">
      <atom type="Label">MoonRay Source Overrides</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.pref.lowLatency ?">
        <atom type="Label">Low-latency rendering</atom>
        <atom type="Tooltip">MoonRay renders below Modo's priority and, where it would take every processor thread, leaves one over, so that Modo stays quick to use while it renders: the render takes what the processor has to spare. Off, as MoonRay itself does: it takes the whole processor at Modo's own priority, a little faster, and Modo can stutter meanwhile. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.binaryGeometry ?">
        <atom type="Label">Load geometry as binary</atom>
        <atom type="Tooltip">Hands MoonRay the scene's geometry (points, faces, UVs, normals) as a binary file beside the scene text, which it reads as bytes rather than parsing millions of numbers: heavy scenes start rendering far sooner. The same picture. Off, everything is written as text, as before. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.drainTiles ?">
        <atom type="Label">Stop finishes the tiles in hand</atom>
        <atom type="Tooltip">A render stopped by hand, or by Smart Render, finishes the tiles MoonRay is working on and ends as a finished frame, so its picture has no dark or coarse patches. Off, as MoonRay itself does: it stops at once, and the tiles it was working on are kept as they stand</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.toonTerminator ?">
        <atom type="Label">Smooth toon edges on coarse meshes</atom>
        <atom type="Tooltip">Toon materials follow the mesh's smooth shading: the edge of a lit band is a smooth line, not stepped along the faces of a coarse or subdivided mesh. Off renders as MoonRay itself does. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.toonAlbedo ?">
        <atom type="Label">Denoise toon materials cleanly</atom>
        <atom type="Tooltip">MoonRay's albedo output gives a toon material its own colour, so the denoiser cleans toon surfaces as it does others. Off, the albedo is MoonRay's own, full of bright specks on toon surfaces, and a denoised toon stays as noisy as it was rendered. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.denoiseCleanGuides ?">
        <atom type="Label">Denoiser cleans its guides first</atom>
        <atom type="Tooltip">Open Image Denoise cleans the albedo and normal guides before the picture and then trusts them fully, so less of the render's noise is left on textured, bumpy and see-through surfaces. Off, as MoonRay itself does: the guides are used as rendered and trusted less. OptiX has no such mode and is unchanged. It takes effect at the next denoising</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.usdSpecular ?">
        <atom type="Label">UsdPreviewSurface specular colour</atom>
        <atom type="Tooltip">A UsdPreviewSurface material in the specular workflow reflects its specular colour. Off, as MoonRay itself does: that workflow has no highlight at all. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.opaqueAlpha ?">
        <atom type="Label">Images without alpha are opaque</atom>
        <atom type="Tooltip">An image with no alpha channel reads as opaque where a material takes its alpha (a mask, presence). Off, as MoonRay itself does: its alpha reads as 0. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.transmissionRoughness ?">
        <atom type="Label">Rough glass under a smooth surface</atom>
        <atom type="Tooltip">A Dwa material's own transmission roughness is kept when its surface is mirror smooth: frosted glass under a polished face. Off, as MoonRay itself does: the transmission is then mirror sharp too. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.ngonEars ?">
        <atom type="Label">N-gons triangulated cleanly</atom>
        <atom type="Tooltip">A flat polygon of more than four corners, as CAD outlines are, is cut into triangles that follow its outline (ear clipping), however small it is and wherever its outline starts. MoonRay and MoonLightIPR are given the same triangles. Off, as MoonRay itself does: a small n-gon, or one whose first corners turn inwards, is fanned from its first corner, and the triangles of a concave one lie over each other, so the face looks torn. Subdivision surfaces keep their n-gons. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.lightMotion ?">
        <atom type="Label">Blur moving lights</atom>
        <atom type="Tooltip">MoonRay moves a light during the shutter only when the light's own motion blur switch (mb) is on, which MoonRay leaves off. On, a light that moves during the shutter is blurred, in MoonRay and MoonLightIPR. Off renders as MoonRay itself does: lights held still</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.cryptoVolumes ?">
        <atom type="Label">Fog in Cryptomatte</atom>
        <atom type="Tooltip">Fog, smoke and clouds have mattes of their own in Cryptomatte, each as strong as the fog is thick, and what lies behind them is covered only as much as shows through. Off, as MoonRay itself does: fog has no matte, and what lies behind it is covered whole. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.fogAlpha ?">
        <atom type="Label">Fog in front of see-through surfaces in alpha</atom>
        <atom type="Tooltip">Fog in front of a partly see-through surface (presence below 1) counts in the picture's alpha. Off, as MoonRay itself does: the alpha there is the surface's alone, as if the fog were not there, so fog in front of a pane against the sky composites thinner than it renders. It takes effect when the next render starts</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.filterInputs ?">
        <atom type="Label">Display filters given the inputs they need</atom>
        <atom type="Tooltip">A display filter left without one of the pictures it needs (a Toon filter's depth, say) takes the one it starts on, with a notice, and one that cannot be given it is left out, said. Off, as MoonRay itself does: such a filter draws nothing, which shows as pink</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.toonLinesApart ?">
        <atom type="Label">Toon lines apart from the shading</atom>
        <atom type="Tooltip">A Toon display filter's Output Mode gives its ink lines alone (white on black, a matte for the compositor) or its shading without them; add one filter of each to composite them. Off, as MoonRay itself does: every Toon filter gives the shading with its lines, whatever its Output Mode</atom>
      </list>
      <list type="Control" val="cmd moonray.pref.cryptoOnce ?">
        <atom type="Label">Count each Cryptomatte sample once</atom>
        <atom type="Tooltip">In MoonRay's vector and XPU modes, each sample's surface is counted once in Cryptomatte. Off, as MoonRay itself does: now and then two render threads both count it, and a pixel's mattes add up to twice its coverage. It takes effect when the next render starts</atom>
      </list>
    </hash>
  </atom>
  <atom type="Filters">
    <hash type="Preset" key="prefs/moonray/overrides:filterPreset">
      <atom type="Name">Source Overrides</atom>
      <atom type="Category">20385740002:filterCat</atom>
      <atom type="Enable">1</atom>
      <list type="Node">1 .group 0 &quot;&quot;</list>
      <list type="Node">1 prefType moonray/overrides</list>
      <list type="Node">-1 .endgroup </list>
    </hash>
    <hash type="Preset" key="prefs/moonray/xpu:filterPreset">
