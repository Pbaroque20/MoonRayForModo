      <atom type="Category">20385740002:filterCat</atom>
      <atom type="Enable">1</atom>
      <list type="Node">1 .group 0 &quot;&quot;</list>
      <list type="Node">1 prefType moonray/xpu</list>
      <list type="Node">-1 .endgroup </list>
    </hash>
    <hash type="Preset" key="prefs/moonray/renderer:filterPreset">
      <atom type="Name">Renderer</atom>
      <atom type="Category">20385740002:filterCat</atom>
      <atom type="Enable">1</atom>
      <list type="Node">1 .group 0 &quot;&quot;</list>
      <list type="Node">1 prefType moonray/renderer</list>
      <list type="Node">-1 .endgroup </list>
    </hash>
    <hash type="Preset" key="prefs/moonray/general:filterPreset">
      <atom type="Name">MoonRay (2026.29.1)</atom>
      <atom type="Category">20385740002:filterCat</atom>
      <atom type="Enable">1</atom>
      <list type="Node">1 .group 0 &quot;&quot;</list>
      <list type="Node">1 prefType moonray/general</list>
      <list type="Node">-1 .endgroup </list>
    </hash>
  </atom>
  <atom type="PreferenceCategories">
    <hash type="PrefCat" key="moonray"></hash>
    <hash type="PrefCat" key="moonray/general"></hash>
    <hash type="PrefCat" key="moonray/renderer"></hash>
    <hash type="PrefCat" key="moonray/xpu"></hash>
    <hash type="PrefCat" key="moonray/overrides"></hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="preferences.categories.en_US">
      <hash type="T" key="moonray">MoonRay (2026.29.1)</hash>
      <hash type="T" key="moonray/general">General</hash>
      <hash type="T" key="moonray/renderer">Renderer</hash>
      <hash type="T" key="moonray/xpu">XPU</hash>
