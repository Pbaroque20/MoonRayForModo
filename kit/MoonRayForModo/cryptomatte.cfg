<?xml version="1.0" encoding="UTF-8"?>
<configuration>
  <!-- A Cryptomatte tab in the properties of geometry and of materials: the name a matte goes by, which items given the
       same name share, and its ID as a number where it is to be one chosen. -->
  <atom type="Attributes">
    <hash type="Sheet" key="MoonRayObjectCryptomatte:sheet">
      <atom type="Label">Cryptomatte</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.object.filter</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">128.5</atom>
      </hash>
      <list type="Control" val="cmd moonray.object.crypto_name ?">
        <atom type="Label">Cryptomatte Name</atom>
        <atom type="Tooltip">The name this object's matte goes by in the object Cryptomatte. Objects given the same name share one matte. Empty, it is the object's own name.</atom>
      </list>
      <list type="Control" val="cmd moonray.object.crypto_id ?">
        <atom type="Label">Cryptomatte ID</atom>
        <atom type="Tooltip">The matte's ID as a number, for a compositing setup that expects one. 0 works it out from the name, as Cryptomatte does.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayMaterialCryptomatte:sheet">
      <atom type="Label">Cryptomatte</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.material.cryptoFilter</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130.5</atom>
      </hash>
      <list type="Control" val="cmd moonray.material.crypto_name ?">
        <atom type="Label">Cryptomatte Name</atom>
        <atom type="Tooltip">The name this material's matte goes by in the material Cryptomatte. Materials given the same name share one matte. Empty, it is the material's own name.</atom>
      </list>
      <list type="Control" val="cmd moonray.material.crypto_id ?">
        <atom type="Label">Cryptomatte ID</atom>
        <atom type="Tooltip">The matte's ID as a number, for a compositing setup that expects one. 0 works it out from the name, as Cryptomatte does.</atom>
      </list>
    </hash>
  </atom>
</configuration>
