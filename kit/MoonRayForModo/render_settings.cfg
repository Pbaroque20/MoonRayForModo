    <hash type="Sheet" key="MoonRayRender_1:sheet">
      <atom type="Label">Sampling</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.sampling_mode ?">
        <atom type="Label">Sampling</atom>
        <atom type="Tooltip">Adaptive stops sampling a pixel once it is clean enough</atom>
      </list>
      <list type="Control" val="cmd moonray.render.samples ?">
        <atom type="Label">Pixel Samples</atom>
        <atom type="Tooltip">Uniform sampling: 4 means 4 x 4 = 16 samples per pixel</atom>
