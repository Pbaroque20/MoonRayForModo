    <hash type="Sheet" key="MoonRayRender_0:sheet">
      <atom type="Label">Camera</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.camera ?">
        <atom type="Label">Render Camera</atom>
        <atom type="Tooltip">Render through the Modo render camera or one of the MoonRay cameras in the scene, such as a fisheye</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_1:sheet">
      <atom type="Label">Sampling</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.sampling_mode ?">
        <atom type="Label">Sampling</atom>
        <atom type="Tooltip">Adaptive stops sampling a pixel once it is clean enough</atom>
      </list>
      <list type="Control" val="cmd moonray.render.samples ?">
        <atom type="Label">Pixel Samples</atom>
        <atom type="Tooltip">Uniform sampling: 4 means 4 x 4 = 16 samples per pixel</atom>
      </list>
      <list type="Control" val="cmd moonray.render.min_adaptive_samples ?">
        <atom type="Label">Minimum Samples</atom>
        <atom type="Tooltip">Adaptive sampling: fewest samples per pixel</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_adaptive_samples ?">
        <atom type="Label">Maximum Samples</atom>
        <atom type="Tooltip">Adaptive sampling: most samples per pixel</atom>
      </list>
      <list type="Control" val="cmd moonray.render.target_adaptive_error ?">
        <atom type="Label">Target Error</atom>
        <atom type="Tooltip">Adaptive sampling: lower is cleaner and slower</atom>
      </list>
      <list type="Control" val="cmd moonray.render.light_sampling_mode ?">
        <atom type="Label">Light Sampling</atom>
      </list>
      <list type="Control" val="cmd moonray.render.light_sampling_quality ?">
        <atom type="Label">Light Quality</atom>
        <atom type="Tooltip">Adaptive light sampling quality</atom>
      </list>
      <list type="Control" val="cmd moonray.render.light_samples ?">
        <atom type="Label">Light Samples</atom>
        <atom type="Tooltip">2 means 2 x 2 samples per light</atom>
      </list>
      <list type="Control" val="cmd moonray.render.bsdf_samples ?">
        <atom type="Label">Material Samples</atom>
        <atom type="Tooltip">2 means 2 x 2 samples per material</atom>
      </list>
      <list type="Control" val="cmd moonray.render.bssrdf_samples ?">
        <atom type="Label">Subsurface Samples</atom>
        <atom type="Tooltip">2 means 2 x 2 subsurface samples. MoonRay XPU2 takes at most 4 x 4</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRenderXPU2:sheet">
      <atom type="Label">XPU2 Sampling</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.xpu2_samples ?">
        <atom type="Label">Generation Samples</atom>
        <atom type="Tooltip">What the render is worth, in samples a pixel on average: the generations share them out where the picture is still noisy. 0: Pixel Samples squared. XPU2 previews always sample this way: MoonRay's Sampling Mode and adaptive settings are for MoonRay renders</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_seed ?">
        <atom type="Label">First Look</atom>
        <atom type="Tooltip">Samples every pixel gets first, before the generations choose where the rest go. 0: an eighth of Generation Samples, 16 at least</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_spend ?">
        <atom type="Label">Halting Rule</atom>
        <atom type="Tooltip">Time = Gen. Samples: the render stops after about the time a plain render of Generation Samples would take, that time spent where the noise is. Exact = Gen. Samples: every pixel gets exactly Generation Samples, however long that takes</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_noise ?">
        <atom type="Label">Halt at Noise</atom>
        <atom type="Tooltip">A part of the picture stops early once it is this clean, in Target Error's units (lower is cleaner, and slower). 0: none, every pixel gets its share. MoonRay's Target Error is for MoonRay renders</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_most ?">
        <atom type="Label">Most Samples</atom>
        <atom type="Tooltip">The most samples one pixel may get. 0: 16 times the average</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_cpu ?">
        <atom type="Label">CPU Workers</atom>
        <atom type="Tooltip">The processor's workers take part in the generations beside the graphics card. Off: the graphics card takes every sample. Which devices XPU2 uses at all: Preferences &gt; MoonRay &gt; XPU2 &gt; Devices</atom>
      </list>
      <list type="Control" val="cmd moonray.render.xpu2_realtime ?">
        <atom type="Label">Realtime Samples</atom>
        <atom type="Tooltip">While realtime follows the scene (RT), the share of Generation Samples XPU2 takes, in percent: lower settles sooner and noisier. Previews started with Render and final renders take them all</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_2:sheet">
      <atom type="Label">Bounces</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.max_depth ?">
        <atom type="Label">Total</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_diffuse_depth ?">
        <atom type="Label">Diffuse</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_glossy_depth ?">
        <atom type="Label">Glossy</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_mirror_depth ?">
        <atom type="Label">Mirror / Refraction</atom>
        <atom type="Tooltip">Raise for stacked glass surfaces</atom>
      </list>
      <list type="Control" val="cmd moonray.render.shadow_terminator_fix ?">
        <atom type="Label">Shadow Terminator</atom>
        <atom type="Tooltip">Softens the faceted shadow edge on coarse meshes</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_volume_depth ?">
        <atom type="Label">Volume</atom>
        <atom type="Tooltip">How many times light bounces inside fog, smoke and clouds. 1 is quick; more brightens thick clouds</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_hair_depth ?">
        <atom type="Label">Hair</atom>
        <atom type="Tooltip">Bounces from hair to hair. More brightens light hair</atom>
      </list>
      <list type="Control" val="cmd moonray.render.disable_optimized_hair_sampling ?">
        <atom type="Label">Sample Hair Lobes Separately</atom>
        <atom type="Tooltip">Each part of a hair material (its highlights, its colour and what passes through) is sampled on its own, so that light path expressions can pick them out one by one. Slower</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_presence_depth ?">
        <atom type="Label">Presence</atom>
        <atom type="Tooltip">How many see-through surfaces a ray passes before it stops</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_subsurface_per_path ?">
        <atom type="Label">Subsurface</atom>
        <atom type="Tooltip">How many times one path may go beneath a surface</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_3:sheet">
      <atom type="Label">Volumes</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.volume_quality ?">
        <atom type="Label">Quality</atom>
        <atom type="Tooltip">How finely fog and clouds are stepped through; higher is cleaner and slower</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_shadow_quality ?">
        <atom type="Label">Shadow Quality</atom>
        <atom type="Tooltip">The same, for the shadows volumes cast</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_illumination_samples ?">
        <atom type="Label">Light Samples</atom>
        <atom type="Tooltip">Samples of light taken along each ray through a volume; 0 turns volume lighting off</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_indirect_samples ?">
        <atom type="Label">Indirect Samples</atom>
        <atom type="Tooltip">Samples of bounced light inside volumes</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_opacity_threshold ?">
        <atom type="Label">Opacity Threshold</atom>
        <atom type="Tooltip">A ray stops once a volume has hidden this much of what is behind it</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_overlap_mode ?">
        <atom type="Label">Overlapping Volumes</atom>
        <atom type="Tooltip">What is rendered where volumes overlap</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_attenuation_factor ?">
        <atom type="Label">Attenuation Factor</atom>
        <atom type="Tooltip">With Volume bounces above 1: how much less each further bounce of light is stopped by the volume. Lower looks more see-through</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_contribution_factor ?">
        <atom type="Label">Contribution Factor</atom>
        <atom type="Tooltip">With Volume bounces above 1: how much less each further bounce of light adds. Lower looks darker</atom>
      </list>
      <list type="Control" val="cmd moonray.render.volume_phase_attenuation_factor ?">
        <atom type="Label">Phase Attenuation Factor</atom>
        <atom type="Tooltip">With Volume bounces above 1: how much more evenly each further bounce of light is thrown, whatever way the volume throws it at first</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_4:sheet">
      <atom type="Label">Noise and Filtering</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.sample_clamping_value ?">
        <atom type="Label">Sample Clamp</atom>
        <atom type="Tooltip">Limits how bright one sample may be, which removes fireflies; 0 is no limit</atom>
      </list>
      <list type="Control" val="cmd moonray.render.sample_clamping_depth ?">
        <atom type="Label">Clamp From Bounce</atom>
        <atom type="Tooltip">The clamp applies from this bounce on; 1 leaves what the camera sees directly alone</atom>
      </list>
      <list type="Control" val="cmd moonray.render.roughness_clamping_factor ?">
        <atom type="Label">Roughness Clamp</atom>
        <atom type="Tooltip">Roughens materials after a bounce to remove fireflies; 0 is off</atom>
      </list>
      <list type="Control" val="cmd moonray.render.russian_roulette_threshold ?">
        <atom type="Label">Russian Roulette</atom>
        <atom type="Tooltip">Paths dimmer than this may be ended early. Lower is cleaner and slower</atom>
      </list>
      <list type="Control" val="cmd moonray.render.pixel_filter ?">
        <atom type="Label">Pixel Filter</atom>
      </list>
      <list type="Control" val="cmd moonray.render.pixel_filter_width ?">
        <atom type="Label">Pixel Filter Width</atom>
        <atom type="Tooltip">In pixels</atom>
      </list>
      <list type="Control" val="cmd moonray.render.texture_blur ?">
        <atom type="Label">Texture Blur</atom>
        <atom type="Tooltip">Softens every texture lookup</atom>
      </list>
      <list type="Control" val="cmd moonray.render.transparency_threshold ?">
        <atom type="Label">Transparency Threshold</atom>
        <atom type="Tooltip">A ray stops once surfaces have hidden this much of what is behind them</atom>
      </list>
      <list type="Control" val="cmd moonray.render.presence_threshold ?">
        <atom type="Label">Presence Threshold</atom>
        <atom type="Tooltip">A ray through see-through surfaces stops once they have hidden this much</atom>
      </list>
      <list type="Control" val="cmd moonray.render.enable_presence_shadows ?">
        <atom type="Label">Presence Shadows</atom>
        <atom type="Tooltip">See-through surfaces cast lighter shadows. Slower. Greyed with Automatic Presence Shadows on (Preferences &gt; MoonRay &gt; Renderer)</atom>
      </list>
      <list type="Control" val="cmd moonray.render.presence_quality ?">
        <atom type="Label">Presence Quality</atom>
        <atom type="Tooltip">How finely light through layered see-through surfaces is followed: 1 follows every layer (cleanest), lower lets chance decide past a point (faster, noisier)</atom>
      </list>
      <list type="Control" val="cmd moonray.render.cryptomatte_multi_presence ?">
        <atom type="Label">Cryptomatte Multi-Presence</atom>
        <atom type="Tooltip">With a Cryptomatte output: each see-through surface a ray passes is a matte sample of its own, so objects behind see-through ones keep their mattes</atom>
      </list>
      <list type="Control" val="cmd moonray.render.lock_frame_noise ?">
        <atom type="Label">Same Noise Every Frame</atom>
        <atom type="Tooltip">The noise pattern does not change from frame to frame</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_5:sheet">
      <atom type="Label">Global Switches</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.enable_displacement ?">
        <atom type="Label">Displacement</atom>
        <atom type="Tooltip">Off renders every displaced surface flat, as it is before its displacement</atom>
      </list>
      <list type="Control" val="cmd moonray.render.enable_subsurface_scattering ?">
        <atom type="Label">Subsurface Scattering</atom>
        <atom type="Tooltip">Off renders subsurface materials with plain diffuse light, which is quicker</atom>
      </list>
      <list type="Control" val="cmd moonray.render.enable_shadowing ?">
        <atom type="Label">Shadows</atom>
        <atom type="Tooltip">Off casts no shadows anywhere: lights reach everything they face</atom>
      </list>
      <list type="Control" val="cmd moonray.render.lights_visible_in_camera ?">
        <atom type="Label">Lights Seen by the Camera</atom>
        <atom type="Tooltip">On shows lights to the camera as glowing shapes. Each MoonRay light can say otherwise for itself</atom>
      </list>
      <list type="Control" val="cmd moonray.render.enable_max_geometry_resolution ?">
        <atom type="Label">Limit Geometry Resolution</atom>
        <atom type="Tooltip">Caps how finely subdivision surfaces and displacement are tessellated</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_geometry_resolution ?">
        <atom type="Label">Geometry Resolution Limit</atom>
        <atom type="Tooltip">The cap, as a tessellation resolution</atom>
      </list>
      <list type="Control" val="cmd moonray.dicing_camera ?">
        <atom type="Label">Dicing Camera</atom>
        <atom type="Tooltip">The camera adaptive tessellation is worked out for: the render camera, or another, for a render whose camera moves or is very close</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_6:sheet">
      <atom type="Label">Denoising</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.denoiser ?">
        <atom type="Label">Denoiser</atom>
      </list>
      <list type="Control" val="cmd moonray.render.denoise_preview ?">
        <atom type="Label">Denoise Preview</atom>
      </list>
      <list type="Control" val="cmd moonray.render.denoise_final ?">
        <atom type="Label">Save Denoised EXR</atom>
        <atom type="Tooltip">Written beside the original EXR, which is kept</atom>
      </list>
      <list type="Control" val="cmd moonray.render.denoise_detail ?">
        <atom type="Label">Keep Fine Detail</atom>
        <atom type="Tooltip">Hair, fur and other things a pixel or so wide, which a denoiser smooths away, are let through from the render as it was. More keeps more of them and more of their grain; Off is the denoiser alone</atom>
      </list>
      <list type="Control" val="cmd moonray.render.smart_render ?">
        <atom type="Label">Smart Render</atom>
        <atom type="Tooltip">A MoonRay render in the preview window is stopped once its picture is clean enough for the denoiser, and denoised: no need to wait for every sample. Draft stops soonest and leaves the denoiser the most to do; Fine stops latest. With no denoiser chosen, OptiX is used, or Open Image Denoise where OptiX will not run. A picture full of fine texture may never read as clean, and renders to its end. Greyed while Safe Denoising is on: switch that off first</atom>
      </list>
      <list type="Control" val="cmd moonray.render.denoise_safe ?">
        <atom type="Label">Safe Denoising</atom>
        <atom type="Tooltip">Keep every buffer of a MoonRay render stopped by hand, and let Continue take it up again: the picture so far is saved as it renders, every few seconds where that is quick and less often for a large picture with many buffers. With this off, Stop still keeps the beauty and denoises it. Greyed while Smart Render is Draft, Medium or Fine: set that to Off first</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_7:sheet">
      <atom type="Label">Lighting</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd moonray.render.light_multiplier ?">
        <atom type="Label">Light Multiplier</atom>
        <atom type="Tooltip">Scales every Modo light</atom>
      </list>
      <list type="Control" val="cmd moonray.render.modo_environment ?">
