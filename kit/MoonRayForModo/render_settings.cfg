        <atom type="Tooltip">Raise for stacked glass surfaces</atom>
      </list>
      <list type="Control" val="cmd moonray.render.shadow_terminator_fix ?">
        <atom type="Label">Shadow Terminator</atom>
        <atom type="Tooltip">Softens the faceted shadow edge on coarse meshes</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_volume_depth ?">
        <atom type="Label">Volume</atom>
        <atom type="Tooltip">How many times light bounces inside fog, smoke and clouds. 1 is quick; more brightens thick clouds</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_hair_depth ?">
        <atom type="Label">Hair</atom>
        <atom type="Tooltip">Bounces from hair to hair. More brightens light hair</atom>
      </list>
      <list type="Control" val="cmd moonray.render.max_presence_depth ?">
        <atom type="Label">Presence</atom>
        <atom type="Tooltip">How many see-through surfaces a ray passes before it stops</atom>
