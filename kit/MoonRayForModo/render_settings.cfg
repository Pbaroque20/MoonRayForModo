      </list>
      <list type="Control" val="cmd moonray.render.environment_multiplier ?">
        <atom type="Label">Environment Multiplier</atom>
      </list>
      <list type="Control" val="cmd moonray.render.environment ?">
        <atom type="Label">Uniform Fill Light</atom>
        <atom type="Tooltip">Extra even light from all directions; 0 is none</atom>
      </list>
      <list type="Control" val="cmd moonray.page objects">
        <atom type="Label">Light Links, Emitters and Volumes...</atom>
        <atom type="Tooltip">Per-object and per-light scene controls</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayRender_8:sheet">
