    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_0:sheet">
      <atom type="Label">Parameters</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_contains_camera ?">
        <atom type="Label">contains camera</atom>
        <atom type="Tooltip">Specifies whether the geometry contains the camera and should be used for IOR tracking. This should not be changed by the user -- they should instead attach the relevant geometry to the camera, which will then flag this geometry.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.pick23_1 ?">
        <atom type="Label">dicing camera</atom>
        <atom type="Tooltip">Alternate camera that is used for adaptive tessellation. This is useful if you want adaptive tessellation to behave consistently in a sequence, regardless of what the main camera is doing</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_references ?">
        <atom type="Label">references</atom>
        <atom type="Tooltip">list of geometries that geometry procedural can reference during procedural generate/update stages. For example, an instancer geometry procedural can instance primitives generated by the reference geometry procedural. The names of MoonRay items, separated by commas.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.append23_8 ?">
        <atom type="Label">add to references</atom>
        <atom type="Tooltip">Adds one of the MoonRay items in the scene to the list above.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_shadow_exclusion_mappings ?">
        <atom type="Label">shadow exclusion mappings</atom>
        <atom type="Tooltip">A space-separated list of mappings of the form A:B where: A is a comma-separated list of names of parts of this Geometry, or an asterisk to specify the whole geometry; B is a comma-separated list of shadow receiver set labels established using the ["shadow_receiver_label"] attribute, or an asterisk to specify to all such sets in the scene. For each of the listed mappings, shadows from the parts specified in A will be suppressed from casting onto any geometries in the ShadowReceiverSets specified in B. **Note: no part name should appear more than once in the string, otherwise the behavior is undefined.**</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_static ?">
        <atom type="Label">static</atom>
        <atom type="Tooltip">disable if the geometry will be updated between frames</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_use_local_camera_motion_blur ?">
        <atom type="Label">use local camera motion blur</atom>
        <atom type="Tooltip">Enables experimental feature that also attempts to remove the camera blur in the local regions</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_use_local_motion_blur ?">
        <atom type="Label">use local motion blur</atom>
        <atom type="Tooltip">Enables the local motion blur feature, which makes the geometry procedural responsible for handling all of the geometry's motion and allows for custom effects</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_1:sheet">
      <atom type="Label">Labels</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_label ?">
        <atom type="Label">label</atom>
        <atom type="Tooltip">label used in material aov expresssions</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_shadow_receiver_label ?">
        <atom type="Label">shadow receiver label</atom>
        <atom type="Tooltip">Label used to associate Geometry objects into ShadowReceiverSets. Using this in combination with the ["shadow_exclusion_mappings"] attribute, shadows from specified geometries or their parts can be suppressed from casting shadows onto one or more specified sets.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_2:sheet">
      <atom type="Label">Assignment</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_modo_material ?">
        <atom type="Label">material tag</atom>
        <atom type="Tooltip">The material tag of the Modo material this is rendered with; empty for the base material.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.pick23_4 ?">
        <atom type="Label">volume</atom>
        <atom type="Tooltip">The name of a MoonRay volume item that fills this shape.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_3:sheet">
      <atom type="Label">Sphere</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_phi_max ?">
        <atom type="Label">phi max</atom>
        <atom type="Tooltip">The arc of the sphere surface around the z axis expressed in degrees.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_radius ?">
        <atom type="Label">radius</atom>
        <atom type="Tooltip">The radius of the sphere. The sphere will clip if the radius exceeds the magnitude of either the zmin or zmax values.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_zmax ?">
        <atom type="Label">zmax</atom>
        <atom type="Tooltip">The maximum extent of sphere on the z axis expressed in object space and independent of the radius. The sphere will clip if the radius exceeds the magnitude of this parameter.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_zmin ?">
        <atom type="Label">zmin</atom>
        <atom type="Tooltip">The minimum extent of sphere on the z axis expressed in object space and independent of the radius. The sphere will clip if the radius exceeds the magnitude of this parameter.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_4:sheet">
      <atom type="Label">Ray Tracing</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_ray_epsilon ?">
        <atom type="Label">ray epsilon</atom>
        <atom type="Tooltip">When a secondary ray is fired, anything within this distance of the intersection point will be ignored. Instead, it is considered part of the current intersection's geometry. If zero, an automatically calculated epsilon will be used.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_shadow_ray_epsilon ?">
        <atom type="Label">shadow ray epsilon</atom>
        <atom type="Tooltip">When a shadow ray is fired, anything within this distance of the intersection point will be ignored. If this value is less than "ray_epsilon", then it has no additional effect.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_5:sheet">
      <atom type="Label">Geometry</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_reverse_normals ?">
        <atom type="Label">reverse normals</atom>
        <atom type="Tooltip">enable to reverse the normals in the geometry</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice23_13 ?">
        <atom type="Label">side type</atom>
        <atom type="Tooltip">set single sidedness of the mesh, will affect the visibility of the mesh based on normal direction</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereGeometry_6:sheet">
      <atom type="Label">Visibility</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_diffuse_reflection ?">
        <atom type="Label">visible diffuse reflection</atom>
        <atom type="Tooltip">whether the geometry is visible in diffuse reflection</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_diffuse_transmission ?">
        <atom type="Label">visible diffuse transmission</atom>
        <atom type="Tooltip">whether the geometry is visible in diffuse transmission</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_glossy_reflection ?">
        <atom type="Label">visible glossy reflection</atom>
        <atom type="Tooltip">whether the geometry is visible in glossy reflection.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_glossy_transmission ?">
        <atom type="Label">visible glossy transmission</atom>
        <atom type="Tooltip">whether the geometry is visible in glossy transmission (refraction).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_in_camera ?">
        <atom type="Label">visible in camera</atom>
        <atom type="Tooltip">whether the geometry is visible to camera rays</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_mirror_reflection ?">
        <atom type="Label">visible mirror reflection</atom>
        <atom type="Tooltip">whether the geometry is visible in miror reflection.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereGeometry$mr_visible_mirror_transmission ?">
        <atom type="Label">visible mirror transmission</atom>
        <atom type="Tooltip">whether the geometry is visible in miror transmission (refraction).</atom>
