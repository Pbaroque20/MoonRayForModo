    <hash type="Sheet" key="MoonRayEntity_BaseVolume_0:sheet">
      <atom type="Label">Scattering Properties</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_anisotropy ?">
        <atom type="Label">anisotropy</atom>
        <atom type="Tooltip">Value in the interval [-1,1] that defines how foward (1) or backward (-1) scattering the volume is. A value of 0.0 indicates an isotropic volume.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_diffuse_color ?">
        <atom type="Label">diffuse color</atom>
        <atom type="Tooltip">Reflectance color of the volume. Technically this is called scattering albedo, which is the scattering coefficient divided by the extinction coefficient. The MoonRay default applies until this is changed.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_diffuse_colors ?">
        <atom type="Label">diffuse colors</atom>
