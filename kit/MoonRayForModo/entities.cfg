          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param12_6 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param12_7 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">Label used in light aov expressions. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
