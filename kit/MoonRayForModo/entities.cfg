    <hash type="Sheet" key="MoonRayEntity_SphericalCamera_1:sheet">
      <atom type="Label">Parameters</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_focal ?">
        <atom type="Label">focal</atom>
        <atom type="Tooltip">Focal length</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_inside_out ?">
        <atom type="Label">inside out</atom>
        <atom type="Tooltip">Set to true if the rendered image is to be mapped onto the outside of a sphere, e.g. the Las Vegas Sphere.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_latitude_zoom_offset ?">
        <atom type="Label">latitude zoom offset</atom>
        <atom type="Tooltip">Attribute for controlling the latitude of the center of zoom when the focal length is changed. By default, zooming will center around the mean of the min and max latitudes, but this behavior can be modified by supplying a non-zero offset which will be added to the mean and will reposition the zoom center.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_longitude_zoom_offset ?">
        <atom type="Label">longitude zoom offset</atom>
        <atom type="Tooltip">Attribute for controlling the longitude of the center of zoom when the focal length is changed. By default, zooming will center around the mean of the min and max longitudes, but this behavior can be modified by supplying a non-zero offset which will be added to the mean and will reposition the zoom center.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_max_latitude ?">
        <atom type="Label">max latitude</atom>
        <atom type="Tooltip">Latitude corresponding to the top of the image</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_max_longitude ?">
        <atom type="Label">max longitude</atom>
        <atom type="Tooltip">Longitude corresponding to the right of the image</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_min_latitude ?">
        <atom type="Label">min latitude</atom>
        <atom type="Tooltip">Latitude corresponding to the bottom of the image</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_min_longitude ?">
        <atom type="Label">min longitude</atom>
        <atom type="Tooltip">Longitude corresponding to the left of the image</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphericalCamera$mr_offset_radius ?">
        <atom type="Label">offset radius</atom>
        <atom type="Tooltip">If using the ["inside_out"] attribute, set this value to a radius large enough to encompass all the geometry you wish to capture.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphericalCamera_2:sheet">
