      </hash>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_0:sheet">
        <atom type="Label">Depth of Field</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_0 ?">
          <atom type="Label">bokeh enable</atom>
          <atom type="Tooltip">Enable Bokeh. Requires DOF to be enabled. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_1 ?">
          <atom type="Label">bokeh angle</atom>
          <atom type="Tooltip">Angle of iris rotation MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_2 ?">
          <atom type="Label">bokeh image</atom>
          <atom type="Tooltip">Path to image file to be used for the iris MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_3 ?">
          <atom type="Label">bokeh sides</atom>
          <atom type="Tooltip">Number of sides of the iris. Specifying less than 3 sides will default to a disk. MoonRay's default: 0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_4 ?">
          <atom type="Label">bokeh weight location</atom>
          <atom type="Tooltip">Distance from the origin of Bokeh shape MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_5 ?">
          <atom type="Label">bokeh weight location</atom>
          <atom type="Tooltip">Controls the strength of weights as samples approach the weight location MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_6 ?">
          <atom type="Label">dof</atom>
          <atom type="Tooltip">Whether to enable depth of field MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_7 ?">
          <atom type="Label">dof aperture</atom>
          <atom type="Tooltip">Depth of field focus distance MoonRay's default: 8.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_8 ?">
          <atom type="Label">dof focus distance</atom>
          <atom type="Tooltip">MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_1:sheet">
        <atom type="Label">Frustum</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_9 ?">
          <atom type="Label">far</atom>
          <atom type="Tooltip">Far clipping plane MoonRay's default: 10000.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_10 ?">
          <atom type="Label">film width aperture</atom>
          <atom type="Tooltip">Scale the aperture of the camera (i.e., the frustum) by this value. MoonRay's default: 24.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_11 ?">
          <atom type="Label">focal</atom>
          <atom type="Tooltip">Focal length MoonRay's default: 30.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_12 ?">
          <atom type="Label">horizontal film offset</atom>
          <atom type="Tooltip">Horizontal offset of the frustum. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_19 ?">
          <atom type="Label">near</atom>
          <atom type="Tooltip">Near clipping plane MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_20 ?">
          <atom type="Label">pixel aspect ratio</atom>
          <atom type="Tooltip">ratio of pixel size y / x MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_25 ?">
          <atom type="Label">vertical film offset</atom>
          <atom type="Tooltip">Vertical offset of the frustum. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_2:sheet">
        <atom type="Label">Motion Blur</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_13 ?">
          <atom type="Label">mb shutter bias</atom>
          <atom type="Tooltip">Biases the motion blur samples toward one end of the shutter interval. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_14 ?">
          <atom type="Label">mb shutter close</atom>
          <atom type="Tooltip">Frame at which the shutter closes, i.e., the end of the motion blur interval. MoonRay's default: 0.25. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_15 ?">
          <atom type="Label">mb shutter open</atom>
          <atom type="Tooltip">Frame at which the shutter opens, i.e., the beginning of the motion blur interval. MoonRay's default: -0.25. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_3:sheet">
        <atom type="Label">Medium</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_16 ?">
          <atom type="Label">medium geometry</atom>
          <atom type="Tooltip">The geometry the camera is 'inside' to which you'd like the medium_material applied. (The use case for this is typically partially-submerged cameras) Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_17 ?">
          <atom type="Label">medium material</atom>
          <atom type="Tooltip">The material the camera is 'inside'. If no medium_geometry is specified, ALL rays will have this initial index of refraction applied. Type the name of another MoonRay item; blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_4:sheet">
        <atom type="Label">Assignment</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_18 ?">
          <atom type="Label">render through this camera</atom>
          <atom type="Tooltip">Render through this camera, from where this item stands, instead of the Modo camera. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_5:sheet">
        <atom type="Label">Render Masks</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_21 ?">
          <atom type="Label">pixel sample map</atom>
          <atom type="Tooltip">Map indicating the number of pixel samples that should be used per pixel (in uniform sampling mode). This is a multiplier on the global pixel sample count specified in SceneVariables. If the provided map has incompatible dimensions, it will be resized. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PerspectiveCamera_6:sheet">
        <atom type="Label">Stereo</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param19_22 ?">
          <atom type="Label">stereo convergence distance</atom>
          <atom type="Tooltip">Distance at which all the stereo views converge. MoonRay's default: 100.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_23 ?">
          <atom type="Label">stereo interocular distance</atom>
          <atom type="Tooltip">Distance between the left and right 'eyes' MoonRay's default: 6.3. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param19_24 ?">
          <atom type="Label">stereo view</atom>
          <atom type="Tooltip">Render from the center, left, or right stereo view. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity20:sheet">
      <atom type="Label">MoonRay Portal Light</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter20</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_PortalLight_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param20_0 ?">
          <atom type="Label">apply scene scale</atom>
          <atom type="Tooltip">Whether to apply scene scale variable when normalized. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_1 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">The light's RGB values. These are combined multiplicatively with the intensity and other attributes in determining the light's 3-channel radiance. MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_3 ?">
          <atom type="Label">exposure</atom>
          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_6 ?">
          <atom type="Label">height</atom>
          <atom type="Tooltip">The height of the rectangle, i.e. the size measured in the light's local y-direction. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_7 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_8 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">Label used in light aov expressions. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_9 ?">
          <atom type="Label">light</atom>
          <atom type="Tooltip">The light on which to use the portal. Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_11 ?">
          <atom type="Label">max shadow distance</atom>
          <atom type="Tooltip">The distance from the light beyond which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_12 ?">
          <atom type="Label">mb</atom>
          <atom type="Tooltip">Whether motion-blur is active for this light. When set to true, the scene's illumination will correctly account for any blur() applied to the light's transformation matrix. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_13 ?">
          <atom type="Label">min shadow distance</atom>
          <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_14 ?">
          <atom type="Label">normalized</atom>
          <atom type="Tooltip">When set to true, the size of the light can be changed without altering the amount of total energy cast into the scene. This is achieved via scaling the light's radiance by the reciprocal of its surface area. When set to false, the radiance is used as-is, regardless of surface area. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_16 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Whether the light is switched on. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_17 ?">
          <atom type="Label">presence shadows</atom>
          <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_18 ?">
          <atom type="Label">ray termination</atom>
          <atom type="Tooltip">Whether the light is used for ray termination color. Ray termination color is used for filling in falsely dark areas where ray paths have been terminated too early by the depth controls. Such a ray path immediately exits to any ray termination light(s) present in the light set being applied to the lobe, ignoring occlusion by scene geometry. Any light can either be a regular light or a ray termination light (but not both). Thus they can be freely assigned to light sets, which provides a mechanism for applying specific ray termination lights to specific materials, parts or objects. Ray termination color is only applied to non-hair transmission lobes. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_21 ?">
          <atom type="Label">spread</atom>
          <atom type="Tooltip">The directionality of light emission. 1 is completely diffuse hemisphere. 0 is parallel to normal of light. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_26 ?">
          <atom type="Label">texture filter</atom>
          <atom type="Tooltip">The filtering mode to apply to the texture. Nearest neighbor is the cheapest filtering mode but produces a blocky result. Switch linear filtering on for a smoother result. Additionally, mip-mapping can be switched on with either nearest neighbor or linear filtering. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_37 ?">
          <atom type="Label">visible in camera</atom>
          <atom type="Tooltip">Whether the light is directly visible in the scene's active camera. When set to "use default" it reads from the value of SceneVariable lights_visible_in_camera. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_40 ?">
          <atom type="Label">width</atom>
          <atom type="Tooltip">The width of the rectangle, i.e. the size measured in the light's local x-direction. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PortalLight_1:sheet">
        <atom type="Label">Map</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param20_2 ?">
          <atom type="Label">contrast</atom>
          <atom type="Tooltip">Per-channel contrast used in color-correcting the light's texture, if one is present. The operation mimics Nuke's ColorCorrect node's contrast function: For input &gt; 0, output = 0.18 * pow(inputCompnent/0.18, contrast). For input &lt;= 0, output = 0.18 * input * pow(1/0.18, contrast). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_4 ?">
          <atom type="Label">gain</atom>
          <atom type="Tooltip">Per-channel gain used in tandem with a per-channel offset for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_5 ?">
          <atom type="Label">gamma</atom>
          <atom type="Tooltip">Per-channel gamma used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_15 ?">
          <atom type="Label">offset</atom>
          <atom type="Tooltip">Per-channel offset used in tandem with a per-channel gain for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_19 ?">
          <atom type="Label">saturation</atom>
          <atom type="Tooltip">Per-channel saturation used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = lerp(luminance(inputRGB), input, saturation). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_22 ?">
          <atom type="Label">temperature</atom>
          <atom type="Tooltip">Color temperature using Nuke-style T/M/I settings (T = temperature, M = magenta/green, I = intensity). This is achieved as follows: The 3-channel temperature is interpreted as the vector (T,M,I). The followiong scale values are then applied to the RGB components: outputR = inputR * (pow(2,I) + M/3 - T/2) outputG = inputG * (pow(2,I) - 2*M/3 outputB = inputB * (pow(2,I) + M/3 + T/2) MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_23 ?">
          <atom type="Label">texture</atom>
          <atom type="Tooltip">File name of the texture applied to the light. If set to the empty string, no texture is applied. Any file format supported by OpenImageIO can be used. The texture is used in 2 ways - for looking up the texture value at the intersection point when a ray hits the light, and for building a lookup-table-based auxilliary data structure used for distributing light samples over the texture. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_24 ?">
          <atom type="Label">texture border color</atom>
          <atom type="Tooltip">RGB value used when a texture lookup occurs outside the texture. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_25 ?">
          <atom type="Label">texture coverage</atom>
          <atom type="Tooltip">Texture scales in the u and v-directions. MoonRay's default: [1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_27 ?">
          <atom type="Label">texture mirror u</atom>
          <atom type="Tooltip">Whether to mirror the texture in the u-direction. If set to false, the texture is repeated in the u-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_28 ?">
          <atom type="Label">texture mirror v</atom>
          <atom type="Tooltip">Whether to mirror the texture in the v-direction. If set to false, the texture is repeated in the v-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_29 ?">
          <atom type="Label">texture reps u</atom>
          <atom type="Tooltip">Number of times texture repeats in u over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_30 ?">
          <atom type="Label">texture reps v</atom>
          <atom type="Tooltip">Number of times texture repeats in v over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_31 ?">
          <atom type="Label">texture rotation</atom>
          <atom type="Tooltip">Clockwise rotation angle in degrees. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_32 ?">
          <atom type="Label">texture translation</atom>
          <atom type="Tooltip">Translation of the texture in (u,v)-space, in units of the texture size. For example, a translation of (0.25, 0.5) will translate the texture one-quarter of its width in the u-direction and one-half of its height in the v-direction. MoonRay's default: [0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PortalLight_2:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param20_10 ?">
          <atom type="Label">light filters</atom>
          <atom type="Tooltip">Vector of LightFilters associated with the light. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_20 ?">
          <atom type="Label">sidedness</atom>
          <atom type="Tooltip">When set to 0 (regular), light is emitted from the front-facing surface of the disk. When set to 1 (reverse), light is emitted from the back-facing surface of the disk. When set to 2 (2-sided), light is emitted from both surfaces of the disk. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_PortalLight_3:sheet">
        <atom type="Label">Visibility Flags</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param20_33 ?">
          <atom type="Label">visible diffuse reflection</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_34 ?">
          <atom type="Label">visible diffuse transmission</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse transmission. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_35 ?">
          <atom type="Label">visible glossy reflection</atom>
          <atom type="Tooltip">Whether the light is visible in glossy reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_36 ?">
          <atom type="Label">visible glossy transmission</atom>
          <atom type="Tooltip">Whether the light is visible in glossy transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_38 ?">
          <atom type="Label">visible mirror reflection</atom>
          <atom type="Tooltip">Whether the light is visible in miror reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param20_39 ?">
          <atom type="Label">visible mirror transmission</atom>
          <atom type="Tooltip">Whether the light is visible in miror transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity21:sheet">
      <atom type="Label">MoonRay Rect Light</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter21</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_RectLight_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param21_0 ?">
          <atom type="Label">apply scene scale</atom>
          <atom type="Tooltip">Whether to apply scene scale variable when normalized. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_1 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">The light's RGB values. These are combined multiplicatively with the intensity and other attributes in determining the light's 3-channel radiance. MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_3 ?">
          <atom type="Label">exposure</atom>
          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_6 ?">
          <atom type="Label">height</atom>
          <atom type="Tooltip">The height of the rectangle, i.e. the size measured in the light's local y-direction. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_7 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_8 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">Label used in light aov expressions. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_10 ?">
          <atom type="Label">max shadow distance</atom>
          <atom type="Tooltip">The distance from the light beyond which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_11 ?">
          <atom type="Label">mb</atom>
          <atom type="Tooltip">Whether motion-blur is active for this light. When set to true, the scene's illumination will correctly account for any blur() applied to the light's transformation matrix. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_12 ?">
          <atom type="Label">min shadow distance</atom>
          <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_13 ?">
          <atom type="Label">normalized</atom>
          <atom type="Tooltip">When set to true, the size of the light can be changed without altering the amount of total energy cast into the scene. This is achieved via scaling the light's radiance by the reciprocal of its surface area. When set to false, the radiance is used as-is, regardless of surface area. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_15 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Whether the light is switched on. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_16 ?">
          <atom type="Label">presence shadows</atom>
          <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_17 ?">
          <atom type="Label">ray termination</atom>
          <atom type="Tooltip">Whether the light is used for ray termination color. Ray termination color is used for filling in falsely dark areas where ray paths have been terminated too early by the depth controls. Such a ray path immediately exits to any ray termination light(s) present in the light set being applied to the lobe, ignoring occlusion by scene geometry. Any light can either be a regular light or a ray termination light (but not both). Thus they can be freely assigned to light sets, which provides a mechanism for applying specific ray termination lights to specific materials, parts or objects. Ray termination color is only applied to non-hair transmission lobes. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_20 ?">
          <atom type="Label">spread</atom>
          <atom type="Tooltip">The directionality of light emission. 1 is completely diffuse hemisphere. 0 is parallel to normal of light. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_25 ?">
          <atom type="Label">texture filter</atom>
          <atom type="Tooltip">The filtering mode to apply to the texture. Nearest neighbor is the cheapest filtering mode but produces a blocky result. Switch linear filtering on for a smoother result. Additionally, mip-mapping can be switched on with either nearest neighbor or linear filtering. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_36 ?">
          <atom type="Label">visible in camera</atom>
          <atom type="Tooltip">Whether the light is directly visible in the scene's active camera. When set to "use default" it reads from the value of SceneVariable lights_visible_in_camera. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_39 ?">
          <atom type="Label">width</atom>
          <atom type="Tooltip">The width of the rectangle, i.e. the size measured in the light's local x-direction. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_RectLight_1:sheet">
        <atom type="Label">Map</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param21_2 ?">
          <atom type="Label">contrast</atom>
          <atom type="Tooltip">Per-channel contrast used in color-correcting the light's texture, if one is present. The operation mimics Nuke's ColorCorrect node's contrast function: For input &gt; 0, output = 0.18 * pow(inputCompnent/0.18, contrast). For input &lt;= 0, output = 0.18 * input * pow(1/0.18, contrast). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_4 ?">
          <atom type="Label">gain</atom>
          <atom type="Tooltip">Per-channel gain used in tandem with a per-channel offset for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_5 ?">
          <atom type="Label">gamma</atom>
          <atom type="Tooltip">Per-channel gamma used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_14 ?">
          <atom type="Label">offset</atom>
          <atom type="Tooltip">Per-channel offset used in tandem with a per-channel gain for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_18 ?">
          <atom type="Label">saturation</atom>
          <atom type="Tooltip">Per-channel saturation used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = lerp(luminance(inputRGB), input, saturation). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_21 ?">
          <atom type="Label">temperature</atom>
          <atom type="Tooltip">Color temperature using Nuke-style T/M/I settings (T = temperature, M = magenta/green, I = intensity). This is achieved as follows: The 3-channel temperature is interpreted as the vector (T,M,I). The followiong scale values are then applied to the RGB components: outputR = inputR * (pow(2,I) + M/3 - T/2) outputG = inputG * (pow(2,I) - 2*M/3 outputB = inputB * (pow(2,I) + M/3 + T/2) MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_22 ?">
          <atom type="Label">texture</atom>
          <atom type="Tooltip">File name of the texture applied to the light. If set to the empty string, no texture is applied. Any file format supported by OpenImageIO can be used. The texture is used in 2 ways - for looking up the texture value at the intersection point when a ray hits the light, and for building a lookup-table-based auxilliary data structure used for distributing light samples over the texture. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_23 ?">
          <atom type="Label">texture border color</atom>
          <atom type="Tooltip">RGB value used when a texture lookup occurs outside the texture. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_24 ?">
          <atom type="Label">texture coverage</atom>
          <atom type="Tooltip">Texture scales in the u and v-directions. MoonRay's default: [1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_26 ?">
          <atom type="Label">texture mirror u</atom>
          <atom type="Tooltip">Whether to mirror the texture in the u-direction. If set to false, the texture is repeated in the u-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_27 ?">
          <atom type="Label">texture mirror v</atom>
          <atom type="Tooltip">Whether to mirror the texture in the v-direction. If set to false, the texture is repeated in the v-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_28 ?">
          <atom type="Label">texture reps u</atom>
          <atom type="Tooltip">Number of times texture repeats in u over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_29 ?">
          <atom type="Label">texture reps v</atom>
          <atom type="Tooltip">Number of times texture repeats in v over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_30 ?">
          <atom type="Label">texture rotation</atom>
          <atom type="Tooltip">Clockwise rotation angle in degrees. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_31 ?">
          <atom type="Label">texture translation</atom>
          <atom type="Tooltip">Translation of the texture in (u,v)-space, in units of the texture size. For example, a translation of (0.25, 0.5) will translate the texture one-quarter of its width in the u-direction and one-half of its height in the v-direction. MoonRay's default: [0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_RectLight_2:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param21_9 ?">
          <atom type="Label">light filters</atom>
          <atom type="Tooltip">Vector of LightFilters associated with the light. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_19 ?">
          <atom type="Label">sidedness</atom>
          <atom type="Tooltip">When set to 0 (regular), light is emitted from the front-facing surface of the disk. When set to 1 (reverse), light is emitted from the back-facing surface of the disk. When set to 2 (2-sided), light is emitted from both surfaces of the disk. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_RectLight_3:sheet">
        <atom type="Label">Visibility Flags</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param21_32 ?">
          <atom type="Label">visible diffuse reflection</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_33 ?">
          <atom type="Label">visible diffuse transmission</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse transmission. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_34 ?">
          <atom type="Label">visible glossy reflection</atom>
          <atom type="Tooltip">Whether the light is visible in glossy reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_35 ?">
          <atom type="Label">visible glossy transmission</atom>
          <atom type="Tooltip">Whether the light is visible in glossy transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_37 ?">
          <atom type="Label">visible mirror reflection</atom>
          <atom type="Tooltip">Whether the light is visible in miror reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param21_38 ?">
          <atom type="Label">visible mirror transmission</atom>
          <atom type="Tooltip">Whether the light is visible in miror transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity22:sheet">
      <atom type="Label">MoonRay Rod Light Filter</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter22</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_RodLightFilter_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param22_0 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">Filter color. Scales the light within the volume. For each color channel: 0 means full shadow, 1 means no shadow. MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_1 ?">
          <atom type="Label">density</atom>
          <atom type="Tooltip">Fades the filter effect. 0 means no effect (like having no filter). 1 means full effect. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_2 ?">
          <atom type="Label">depth</atom>
          <atom type="Tooltip">Depth of the base box (before radius and edge). MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_3 ?">
          <atom type="Label">edge</atom>
          <atom type="Tooltip">Size of transition zone from the rounded box to the outside. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_4 ?">
          <atom type="Label">height</atom>
          <atom type="Tooltip">Height of the base box (before radius and edge). MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_5 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">Scalar for multiplying the color. 0 means black, 1 means no change. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_6 ?">
          <atom type="Label">invert</atom>
          <atom type="Tooltip">Swap application of filter from inside the volume to outside. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_8 ?">
          <atom type="Label">radius</atom>
          <atom type="Tooltip">Radius by which to expand the base box into a rounded box. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_9 ?">
          <atom type="Label">input distance for ramp control</atom>
          <atom type="Tooltip">Input distance for ramp control. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_10 ?">
          <atom type="Label">interpolation types</atom>
          <atom type="Tooltip">Interpolation types for ramp control. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_11 ?">
          <atom type="Label">remapped distances for ramp control</atom>
          <atom type="Tooltip">Remapped distances for ramp control. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param22_12 ?">
          <atom type="Label">width</atom>
          <atom type="Tooltip">Width of the base box (before radius and edge). MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_RodLightFilter_1:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param22_7 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Turns the light filter on/off. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity23:sheet">
      <atom type="Label">MoonRay Sphere Geometry</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter23</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_0:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_0 ?">
          <atom type="Label">contains camera</atom>
          <atom type="Tooltip">Specifies whether the geometry contains the camera and should be used for IOR tracking. This should not be changed by the user -- they should instead attach the relevant geometry to the camera, which will then flag this geometry. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_1 ?">
          <atom type="Label">dicing camera</atom>
          <atom type="Tooltip">Alternate camera that is used for adaptive tessellation. This is useful if you want adaptive tessellation to behave consistently in a sequence, regardless of what the main camera is doing Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_8 ?">
          <atom type="Label">references</atom>
          <atom type="Tooltip">list of geometries that geometry procedural can reference during procedural generate/update stages. For example, an instancer geometry procedural can instance primitives generated by the reference geometry procedural. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_10 ?">
          <atom type="Label">shadow exclusion mappings</atom>
          <atom type="Tooltip">A space-separated list of mappings of the form A:B where: A is a comma-separated list of names of parts of this Geometry, or an asterisk to specify the whole geometry; B is a comma-separated list of shadow receiver set labels established using the ["shadow_receiver_label"] attribute, or an asterisk to specify to all such sets in the scene. For each of the listed mappings, shadows from the parts specified in A will be suppressed from casting onto any geometries in the ShadowReceiverSets specified in B. **Note: no part name should appear more than once in the string, otherwise the behavior is undefined.** MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_14 ?">
          <atom type="Label">static</atom>
          <atom type="Tooltip">disable if the geometry will be updated between frames MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_15 ?">
          <atom type="Label">use local camera motion blur</atom>
          <atom type="Tooltip">Enables experimental feature that also attempts to remove the camera blur in the local regions MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_16 ?">
          <atom type="Label">use local motion blur</atom>
          <atom type="Tooltip">Enables the local motion blur feature, which makes the geometry procedural responsible for handling all of the geometry's motion and allows for custom effects MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_1:sheet">
        <atom type="Label">Labels</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_2 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">label used in material aov expresssions MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_12 ?">
          <atom type="Label">shadow receiver label</atom>
          <atom type="Tooltip">Label used to associate Geometry objects into ShadowReceiverSets. Using this in combination with the ["shadow_exclusion_mappings"] attribute, shadows from specified geometries or their parts can be suppressed from casting shadows onto one or more specified sets. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_2:sheet">
        <atom type="Label">Assignment</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_3 ?">
          <atom type="Label">material tag</atom>
          <atom type="Tooltip">The material tag of the Modo material this is rendered with; empty for the base material. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_4 ?">
          <atom type="Label">volume</atom>
          <atom type="Tooltip">The name of a MoonRay volume item that fills this shape. Type the name of another MoonRay item; blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_3:sheet">
        <atom type="Label">Sphere</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_5 ?">
          <atom type="Label">phi max</atom>
          <atom type="Tooltip">The arc of the sphere surface around the z axis expressed in degrees. MoonRay's default: 360. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_6 ?">
          <atom type="Label">radius</atom>
          <atom type="Tooltip">The radius of the sphere. The sphere will clip if the radius exceeds the magnitude of either the zmin or zmax values. MoonRay's default: 1. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_26 ?">
          <atom type="Label">zmax</atom>
          <atom type="Tooltip">The maximum extent of sphere on the z axis expressed in object space and independent of the radius. The sphere will clip if the radius exceeds the magnitude of this parameter. MoonRay's default: 1. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_27 ?">
          <atom type="Label">zmin</atom>
          <atom type="Tooltip">The minimum extent of sphere on the z axis expressed in object space and independent of the radius. The sphere will clip if the radius exceeds the magnitude of this parameter. MoonRay's default: -1. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_4:sheet">
        <atom type="Label">Ray Tracing</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_7 ?">
          <atom type="Label">ray epsilon</atom>
          <atom type="Tooltip">When a secondary ray is fired, anything within this distance of the intersection point will be ignored. Instead, it is considered part of the current intersection's geometry. If zero, an automatically calculated epsilon will be used. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_11 ?">
          <atom type="Label">shadow ray epsilon</atom>
          <atom type="Tooltip">When a shadow ray is fired, anything within this distance of the intersection point will be ignored. If this value is less than "ray_epsilon", then it has no additional effect. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_5:sheet">
        <atom type="Label">Geometry</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_9 ?">
          <atom type="Label">reverse normals</atom>
          <atom type="Tooltip">enable to reverse the normals in the geometry MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_13 ?">
          <atom type="Label">side type</atom>
          <atom type="Tooltip">set single sidedness of the mesh, will affect the visibility of the mesh based on normal direction Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereGeometry_6:sheet">
        <atom type="Label">Visibility</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param23_17 ?">
          <atom type="Label">visible diffuse reflection</atom>
          <atom type="Tooltip">whether the geometry is visible in diffuse reflection MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_18 ?">
          <atom type="Label">visible diffuse transmission</atom>
          <atom type="Tooltip">whether the geometry is visible in diffuse transmission MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_19 ?">
          <atom type="Label">visible glossy reflection</atom>
          <atom type="Tooltip">whether the geometry is visible in glossy reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_20 ?">
          <atom type="Label">visible glossy transmission</atom>
          <atom type="Tooltip">whether the geometry is visible in glossy transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_21 ?">
          <atom type="Label">visible in camera</atom>
          <atom type="Tooltip">whether the geometry is visible to camera rays MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_22 ?">
          <atom type="Label">visible mirror reflection</atom>
          <atom type="Tooltip">whether the geometry is visible in miror reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_23 ?">
          <atom type="Label">visible mirror transmission</atom>
          <atom type="Tooltip">whether the geometry is visible in miror transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_24 ?">
          <atom type="Label">visible shadow</atom>
          <atom type="Tooltip">whether the geometry casts shadows MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param23_25 ?">
          <atom type="Label">visible volume</atom>
          <atom type="Tooltip">whether the geometry is visible in indirect volume rays MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity24:sheet">
      <atom type="Label">MoonRay Sphere Light</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter24</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_SphereLight_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param24_0 ?">
          <atom type="Label">apply scene scale</atom>
          <atom type="Tooltip">Whether to apply scene scale variable when normalized. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_1 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">The light's RGB values. These are combined multiplicatively with the intensity and other attributes in determining the light's 3-channel radiance. MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_3 ?">
          <atom type="Label">exposure</atom>
          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_6 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_7 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">Label used in light aov expressions. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_9 ?">
          <atom type="Label">max shadow distance</atom>
          <atom type="Tooltip">The distance from the light beyond which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_10 ?">
          <atom type="Label">mb</atom>
          <atom type="Tooltip">Whether motion-blur is active for this light. When set to true, the scene's illumination will correctly account for any blur() applied to the light's transformation matrix. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_11 ?">
          <atom type="Label">min shadow distance</atom>
          <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_12 ?">
          <atom type="Label">normalized</atom>
          <atom type="Tooltip">When set to true, the size of the light can be changed without altering the amount of total energy cast into the scene. This is achieved via scaling the light's radiance by the reciprocal of its surface area. When set to false, the radiance is used as-is, regardless of surface area. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_14 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Whether the light is switched on. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_15 ?">
          <atom type="Label">presence shadows</atom>
          <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_16 ?">
          <atom type="Label">radius</atom>
          <atom type="Tooltip">Radius of the sphere. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_17 ?">
          <atom type="Label">ray termination</atom>
          <atom type="Tooltip">Whether the light is used for ray termination color. Ray termination color is used for filling in falsely dark areas where ray paths have been terminated too early by the depth controls. Such a ray path immediately exits to any ray termination light(s) present in the light set being applied to the lobe, ignoring occlusion by scene geometry. Any light can either be a regular light or a ray termination light (but not both). Thus they can be freely assigned to light sets, which provides a mechanism for applying specific ray termination lights to specific materials, parts or objects. Ray termination color is only applied to non-hair transmission lobes. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_24 ?">
          <atom type="Label">texture filter</atom>
          <atom type="Tooltip">The filtering mode to apply to the texture. Nearest neighbor is the cheapest filtering mode but produces a blocky result. Switch linear filtering on for a smoother result. Additionally, mip-mapping can be switched on with either nearest neighbor or linear filtering. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_35 ?">
          <atom type="Label">visible in camera</atom>
          <atom type="Tooltip">Whether the light is directly visible in the scene's active camera. When set to "use default" it reads from the value of SceneVariable lights_visible_in_camera. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereLight_1:sheet">
        <atom type="Label">Map</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param24_2 ?">
          <atom type="Label">contrast</atom>
          <atom type="Tooltip">Per-channel contrast used in color-correcting the light's texture, if one is present. The operation mimics Nuke's ColorCorrect node's contrast function: For input &gt; 0, output = 0.18 * pow(inputCompnent/0.18, contrast). For input &lt;= 0, output = 0.18 * input * pow(1/0.18, contrast). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_4 ?">
          <atom type="Label">gain</atom>
          <atom type="Tooltip">Per-channel gain used in tandem with a per-channel offset for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_5 ?">
          <atom type="Label">gamma</atom>
          <atom type="Tooltip">Per-channel gamma used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_13 ?">
          <atom type="Label">offset</atom>
          <atom type="Tooltip">Per-channel offset used in tandem with a per-channel gain for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_18 ?">
          <atom type="Label">saturation</atom>
          <atom type="Tooltip">Per-channel saturation used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = lerp(luminance(inputRGB), input, saturation). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_20 ?">
          <atom type="Label">temperature</atom>
          <atom type="Tooltip">Color temperature using Nuke-style T/M/I settings (T = temperature, M = magenta/green, I = intensity). This is achieved as follows: The 3-channel temperature is interpreted as the vector (T,M,I). The followiong scale values are then applied to the RGB components: outputR = inputR * (pow(2,I) + M/3 - T/2) outputG = inputG * (pow(2,I) - 2*M/3 outputB = inputB * (pow(2,I) + M/3 + T/2) MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_21 ?">
          <atom type="Label">texture</atom>
          <atom type="Tooltip">File name of the texture applied to the light. If set to the empty string, no texture is applied. Any file format supported by OpenImageIO can be used. The texture is used in 2 ways - for looking up the texture value at the intersection point when a ray hits the light, and for building a lookup-table-based auxilliary data structure used for distributing light samples over the texture. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_22 ?">
          <atom type="Label">texture border color</atom>
          <atom type="Tooltip">RGB value used when a texture lookup occurs outside the texture. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_23 ?">
          <atom type="Label">texture coverage</atom>
          <atom type="Tooltip">Texture scales in the u and v-directions. MoonRay's default: [1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_25 ?">
          <atom type="Label">texture mirror u</atom>
          <atom type="Tooltip">Whether to mirror the texture in the u-direction. If set to false, the texture is repeated in the u-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_26 ?">
          <atom type="Label">texture mirror v</atom>
          <atom type="Tooltip">Whether to mirror the texture in the v-direction. If set to false, the texture is repeated in the v-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_27 ?">
          <atom type="Label">texture reps u</atom>
          <atom type="Tooltip">Number of times texture repeats in u over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_28 ?">
          <atom type="Label">texture reps v</atom>
          <atom type="Tooltip">Number of times texture repeats in v over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_29 ?">
          <atom type="Label">texture rotation</atom>
          <atom type="Tooltip">Clockwise rotation angle in degrees. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_30 ?">
          <atom type="Label">texture translation</atom>
          <atom type="Tooltip">Translation of the texture in (u,v)-space, in units of the texture size. For example, a translation of (0.25, 0.5) will translate the texture one-quarter of its width in the u-direction and one-half of its height in the v-direction. MoonRay's default: [0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereLight_2:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param24_8 ?">
          <atom type="Label">light filters</atom>
          <atom type="Tooltip">Vector of LightFilters associated with the light. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_19 ?">
          <atom type="Label">sidedness</atom>
          <atom type="Tooltip">When set to 0 (regular), light is emitted from the outward-facing surface of the sphere. When set to 1 (reverse), light is emitted from the inward-facing surface of the sphere. There is no mode for emitting from both surfaces at the same time, but two sphere lights of opposing sidedness can be combined to achieve this effect. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphereLight_3:sheet">
        <atom type="Label">Visibility Flags</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param24_31 ?">
          <atom type="Label">visible diffuse reflection</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_32 ?">
          <atom type="Label">visible diffuse transmission</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse transmission. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_33 ?">
          <atom type="Label">visible glossy reflection</atom>
          <atom type="Tooltip">Whether the light is visible in glossy reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_34 ?">
          <atom type="Label">visible glossy transmission</atom>
          <atom type="Tooltip">Whether the light is visible in glossy transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_36 ?">
          <atom type="Label">visible mirror reflection</atom>
          <atom type="Tooltip">Whether the light is visible in miror reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param24_37 ?">
          <atom type="Label">visible mirror transmission</atom>
          <atom type="Tooltip">Whether the light is visible in miror transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity25:sheet">
      <atom type="Label">MoonRay Spherical Camera</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter25</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_0:sheet">
        <atom type="Label">Frustum</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_0 ?">
          <atom type="Label">far</atom>
          <atom type="Tooltip">Far clipping plane MoonRay's default: 10000.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_15 ?">
          <atom type="Label">near</atom>
          <atom type="Tooltip">Near clipping plane MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_1:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_1 ?">
          <atom type="Label">focal</atom>
          <atom type="Tooltip">Focal length MoonRay's default: 30.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_2 ?">
          <atom type="Label">inside out</atom>
          <atom type="Tooltip">Set to true if the rendered image is to be mapped onto the outside of a sphere, e.g. the Las Vegas Sphere. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_3 ?">
          <atom type="Label">latitude zoom offset</atom>
          <atom type="Tooltip">Attribute for controlling the latitude of the center of zoom when the focal length is changed. By default, zooming will center around the mean of the min and max latitudes, but this behavior can be modified by supplying a non-zero offset which will be added to the mean and will reposition the zoom center. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_4 ?">
          <atom type="Label">longitude zoom offset</atom>
          <atom type="Tooltip">Attribute for controlling the longitude of the center of zoom when the focal length is changed. By default, zooming will center around the mean of the min and max longitudes, but this behavior can be modified by supplying a non-zero offset which will be added to the mean and will reposition the zoom center. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_5 ?">
          <atom type="Label">max latitude</atom>
          <atom type="Tooltip">Latitude corresponding to the top of the image MoonRay's default: 90.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_6 ?">
          <atom type="Label">max longitude</atom>
          <atom type="Tooltip">Longitude corresponding to the right of the image MoonRay's default: 180.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_12 ?">
          <atom type="Label">min latitude</atom>
          <atom type="Tooltip">Latitude corresponding to the bottom of the image MoonRay's default: -90.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_13 ?">
          <atom type="Label">min longitude</atom>
          <atom type="Tooltip">Longitude corresponding to the left of the image MoonRay's default: -180.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_16 ?">
          <atom type="Label">offset radius</atom>
          <atom type="Tooltip">If using the ["inside_out"] attribute, set this value to a radius large enough to encompass all the geometry you wish to capture. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_2:sheet">
        <atom type="Label">Motion Blur</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_7 ?">
          <atom type="Label">mb shutter bias</atom>
          <atom type="Tooltip">Biases the motion blur samples toward one end of the shutter interval. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_8 ?">
          <atom type="Label">mb shutter close</atom>
          <atom type="Tooltip">Frame at which the shutter closes, i.e., the end of the motion blur interval. MoonRay's default: 0.25. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_9 ?">
          <atom type="Label">mb shutter open</atom>
          <atom type="Tooltip">Frame at which the shutter opens, i.e., the beginning of the motion blur interval. MoonRay's default: -0.25. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_3:sheet">
        <atom type="Label">Medium</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_10 ?">
          <atom type="Label">medium geometry</atom>
          <atom type="Tooltip">The geometry the camera is 'inside' to which you'd like the medium_material applied. (The use case for this is typically partially-submerged cameras) Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param25_11 ?">
          <atom type="Label">medium material</atom>
          <atom type="Tooltip">The material the camera is 'inside'. If no medium_geometry is specified, ALL rays will have this initial index of refraction applied. Type the name of another MoonRay item; blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_4:sheet">
        <atom type="Label">Assignment</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_14 ?">
          <atom type="Label">render through this camera</atom>
          <atom type="Tooltip">Render through this camera, from where this item stands, instead of the Modo camera. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SphericalCamera_5:sheet">
        <atom type="Label">Render Masks</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param25_17 ?">
          <atom type="Label">pixel sample map</atom>
          <atom type="Tooltip">Map indicating the number of pixel samples that should be used per pixel (in uniform sampling mode). This is a multiplier on the global pixel sample count specified in SceneVariables. If the provided map has incompatible dimensions, it will be resized. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity26:sheet">
      <atom type="Label">MoonRay Spot Light</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter26</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_SpotLight_0:sheet">
        <atom type="Label">Falloff</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_0 ?">
          <atom type="Label">angle falloff type</atom>
          <atom type="Tooltip">The falloff function applied between the outer and inner cones. To calculate this, the angle from the cone's axis to the the point being illuminated is measured as seen from the SpotLight's position. This angle is converted into a fractional value representing the fraction from the outer cone angle to the inner cone angle, clamped to the range [0,1]. The resulting value is then fed into one of the following user-selectable functions to determine the final 0-1 scaling value to be applied to thelight's radiance: 0 (off) - no fallof, a step function at the outer cone boundary is applied 1 (linear) - a linear ramp, i.e. the fractional parameter is applied as-is 2 (ease in) - a quadratic ramp with zero gradient at the start point (outer cone) 3 (ease out) - a quadratic ramp with zero gradient at the end point (inner cone) 4 (ease in/out) - a cubic ramp with zero gradient at both ends (outer and inner cone) MoonRay's default: 4. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_3 ?">
          <atom type="Label">black level</atom>
          <atom type="Tooltip">The radiance used for rendering the SpotLight lens as seen through the camera via a primary ray, when the true computed radiance would otherwise be black. This is simply a convenience feature to make the SpotLight lens visible in the camera view. MoonRay's default: 0.001. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SpotLight_1:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_1 ?">
          <atom type="Label">apply scene scale</atom>
          <atom type="Tooltip">Whether to apply scene scale variable when normalized. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_4 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">The light's RGB values. These are combined multiplicatively with the intensity and other attributes in determining the light's 3-channel radiance. MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_6 ?">
          <atom type="Label">exposure</atom>
          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_11 ?">
          <atom type="Label">intensity</atom>
          <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_12 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">Label used in light aov expressions. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_15 ?">
          <atom type="Label">max shadow distance</atom>
          <atom type="Tooltip">The distance from the light beyond which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_16 ?">
          <atom type="Label">mb</atom>
          <atom type="Tooltip">Whether motion-blur is active for this light. When set to true, the scene's illumination will correctly account for any blur() applied to the light's transformation matrix. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_17 ?">
          <atom type="Label">min shadow distance</atom>
          <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_18 ?">
          <atom type="Label">normalized</atom>
          <atom type="Tooltip">When set to true, the size of the light can be changed without altering the amount of total energy cast into the scene. This is achieved via scaling the light's radiance by the reciprocal of its surface area. When set to false, the radiance is used as-is, regardless of surface area. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_20 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Whether the light is switched on. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_22 ?">
          <atom type="Label">presence shadows</atom>
          <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_23 ?">
          <atom type="Label">ray termination</atom>
          <atom type="Tooltip">Whether the light is used for ray termination color. Ray termination color is used for filling in falsely dark areas where ray paths have been terminated too early by the depth controls. Such a ray path immediately exits to any ray termination light(s) present in the light set being applied to the lobe, ignoring occlusion by scene geometry. Any light can either be a regular light or a ray termination light (but not both). Thus they can be freely assigned to light sets, which provides a mechanism for applying specific ray termination lights to specific materials, parts or objects. Ray termination color is only applied to non-hair transmission lobes. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_29 ?">
          <atom type="Label">texture filter</atom>
          <atom type="Tooltip">The filtering mode to apply to the texture. Nearest neighbor is the cheapest filtering mode but produces a blocky result. Switch linear filtering on for a smoother result. Additionally, mip-mapping can be switched on with either nearest neighbor or linear filtering. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_40 ?">
          <atom type="Label">visible in camera</atom>
          <atom type="Tooltip">Whether the light is directly visible in the scene's active camera. When set to "use default" it reads from the value of SceneVariable lights_visible_in_camera. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SpotLight_2:sheet">
        <atom type="Label">Cone</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_2 ?">
          <atom type="Label">aspect ratio</atom>
          <atom type="Tooltip">The aspect ratio of the lens - its local y dimension divided by its local x dimension. Values other than 1.0 will give the lens a non-circular elliptical shape. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_7 ?">
          <atom type="Label">focal plane distance</atom>
          <atom type="Tooltip">The distance from the SpotLight's position, measured in the direction the light is pointing, at which the projected image will be in focus. MoonRay's default: 10000000000.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_10 ?">
          <atom type="Label">inner cone angle</atom>
          <atom type="Tooltip">The apex angle of the bright inner cone of the light emitted by the SpotLight. Full illumination takes place inside this region. This is a full angle, measured from one side to the other. There is a falloff function applied between the outer and inner cones - see the angle_falloff_type attribute. MoonRay's default: 30.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_13 ?">
          <atom type="Label">lens radius</atom>
          <atom type="Tooltip">The radius of the SpotLight's lens (when the aspect ratio is 1.0, so that the lens is circular). MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_21 ?">
          <atom type="Label">outer cone angle</atom>
          <atom type="Tooltip">The apex angle of the bounding cone of the light emitted by the SpotLight. No illumination takes placeoutside this angle. This is a full angle, measured from one side to the other. There is a falloff function applied between the outer and inner cones - see the angle_falloff_type attribute. MoonRay's default: 60.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SpotLight_3:sheet">
        <atom type="Label">Map</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_5 ?">
          <atom type="Label">contrast</atom>
          <atom type="Tooltip">Per-channel contrast used in color-correcting the light's texture, if one is present. The operation mimics Nuke's ColorCorrect node's contrast function: For input &gt; 0, output = 0.18 * pow(inputCompnent/0.18, contrast). For input &lt;= 0, output = 0.18 * input * pow(1/0.18, contrast). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_8 ?">
          <atom type="Label">gain</atom>
          <atom type="Tooltip">Per-channel gain used in tandem with a per-channel offset for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_9 ?">
          <atom type="Label">gamma</atom>
          <atom type="Tooltip">Per-channel gamma used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_19 ?">
          <atom type="Label">offset</atom>
          <atom type="Tooltip">Per-channel offset used in tandem with a per-channel gain for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_24 ?">
          <atom type="Label">saturation</atom>
          <atom type="Tooltip">Per-channel saturation used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = lerp(luminance(inputRGB), input, saturation). MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_25 ?">
          <atom type="Label">temperature</atom>
          <atom type="Tooltip">Color temperature using Nuke-style T/M/I settings (T = temperature, M = magenta/green, I = intensity). This is achieved as follows: The 3-channel temperature is interpreted as the vector (T,M,I). The followiong scale values are then applied to the RGB components: outputR = inputR * (pow(2,I) + M/3 - T/2) outputG = inputG * (pow(2,I) - 2*M/3 outputB = inputB * (pow(2,I) + M/3 + T/2) MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_26 ?">
          <atom type="Label">texture</atom>
          <atom type="Tooltip">File name of the texture applied to the light. If set to the empty string, no texture is applied. Any file format supported by OpenImageIO can be used. The texture is used in 2 ways - for looking up the texture value at the intersection point when a ray hits the light, and for building a lookup-table-based auxilliary data structure used for distributing light samples over the texture. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_27 ?">
          <atom type="Label">texture border color</atom>
          <atom type="Tooltip">RGB value used when a texture lookup occurs outside the texture. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_28 ?">
          <atom type="Label">texture coverage</atom>
          <atom type="Tooltip">Texture scales in the u and v-directions. MoonRay's default: [1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_30 ?">
          <atom type="Label">texture mirror u</atom>
          <atom type="Tooltip">Whether to mirror the texture in the u-direction. If set to false, the texture is repeated in the u-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_31 ?">
          <atom type="Label">texture mirror v</atom>
          <atom type="Tooltip">Whether to mirror the texture in the v-direction. If set to false, the texture is repeated in the v-direction. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_32 ?">
          <atom type="Label">texture reps u</atom>
          <atom type="Tooltip">Number of times texture repeats in u over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_33 ?">
          <atom type="Label">texture reps v</atom>
          <atom type="Tooltip">Number of times texture repeats in v over the scaled texture space. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_34 ?">
          <atom type="Label">texture rotation</atom>
          <atom type="Tooltip">Clockwise rotation angle in degrees. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_35 ?">
          <atom type="Label">texture translation</atom>
          <atom type="Tooltip">Translation of the texture in (u,v)-space, in units of the texture size. For example, a translation of (0.25, 0.5) will translate the texture one-quarter of its width in the u-direction and one-half of its height in the v-direction. MoonRay's default: [0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SpotLight_4:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_14 ?">
          <atom type="Label">light filters</atom>
          <atom type="Tooltip">Vector of LightFilters associated with the light. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_SpotLight_5:sheet">
        <atom type="Label">Visibility Flags</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param26_36 ?">
          <atom type="Label">visible diffuse reflection</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_37 ?">
          <atom type="Label">visible diffuse transmission</atom>
          <atom type="Tooltip">Whether the light is visible in diffuse transmission. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_38 ?">
          <atom type="Label">visible glossy reflection</atom>
          <atom type="Tooltip">Whether the light is visible in glossy reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_39 ?">
          <atom type="Label">visible glossy transmission</atom>
          <atom type="Tooltip">Whether the light is visible in glossy transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_41 ?">
          <atom type="Label">visible mirror reflection</atom>
          <atom type="Tooltip">Whether the light is visible in miror reflection. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param26_42 ?">
          <atom type="Label">visible mirror transmission</atom>
          <atom type="Tooltip">Whether the light is visible in miror transmission (refraction). MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity27:sheet">
      <atom type="Label">MoonRay Vdb Geometry</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter27</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_VdbGeometry_0:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param27_0 ?">
          <atom type="Label">contains camera</atom>
          <atom type="Tooltip">Specifies whether the geometry contains the camera and should be used for IOR tracking. This should not be changed by the user -- they should instead attach the relevant geometry to the camera, which will then flag this geometry. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_2 ?">
          <atom type="Label">dicing camera</atom>
          <atom type="Tooltip">Alternate camera that is used for adaptive tessellation. This is useful if you want adaptive tessellation to behave consistently in a sequence, regardless of what the main camera is doing Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_11 ?">
          <atom type="Label">references</atom>
          <atom type="Tooltip">list of geometries that geometry procedural can reference during procedural generate/update stages. For example, an instancer geometry procedural can instance primitives generated by the reference geometry procedural. Type the name of another MoonRay item (several, separated by commas); blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_13 ?">
          <atom type="Label">shadow exclusion mappings</atom>
          <atom type="Tooltip">A space-separated list of mappings of the form A:B where: A is a comma-separated list of names of parts of this Geometry, or an asterisk to specify the whole geometry; B is a comma-separated list of shadow receiver set labels established using the ["shadow_receiver_label"] attribute, or an asterisk to specify to all such sets in the scene. For each of the listed mappings, shadows from the parts specified in A will be suppressed from casting onto any geometries in the ShadowReceiverSets specified in B. **Note: no part name should appear more than once in the string, otherwise the behavior is undefined.** MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_17 ?">
          <atom type="Label">static</atom>
          <atom type="Tooltip">disable if the geometry will be updated between frames MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_18 ?">
          <atom type="Label">use local camera motion blur</atom>
          <atom type="Tooltip">Enables experimental feature that also attempts to remove the camera blur in the local regions MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_19 ?">
          <atom type="Label">use local motion blur</atom>
          <atom type="Tooltip">Enables the local motion blur feature, which makes the geometry procedural responsible for handling all of the geometry's motion and allows for custom effects MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_VdbGeometry_1:sheet">
        <atom type="Label">VDB</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param27_1 ?">
          <atom type="Label">density grid</atom>
          <atom type="Tooltip">The name of the density grid. If multiple grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "density[3]". The index must be in [] brackets. MoonRay's default: "density". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_3 ?">
          <atom type="Label">emission grid</atom>
          <atom type="Tooltip">The name of the emission grid. If multiple grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "emission[3]". The index must be in [] brackets. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_4 ?">
          <atom type="Label">emission sample rate</atom>
          <atom type="Tooltip">the relative scale of input emission grid resolution. Lower value has lower memory overhead and faster render time, with the cost of lower fidelity of emission shape and illumination MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_5 ?">
          <atom type="Label">interpolation</atom>
          <atom type="Tooltip">Voxel interpolation to use when sampling the volume data MoonRay's default: 1. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_7 ?">
          <atom type="Label">model</atom>
          <atom type="Tooltip">The VDB file to load MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_VdbGeometry_2:sheet">
        <atom type="Label">Labels</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param27_6 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">label used in material aov expresssions MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_15 ?">
          <atom type="Label">shadow receiver label</atom>
          <atom type="Tooltip">Label used to associate Geometry objects into ShadowReceiverSets. Using this in combination with the ["shadow_exclusion_mappings"] attribute, shadows from specified geometries or their parts can be suppressed from casting shadows onto one or more specified sets. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_VdbGeometry_3:sheet">
        <atom type="Label">Assignment</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param27_8 ?">
          <atom type="Label">material tag</atom>
          <atom type="Tooltip">The material tag of the Modo material this is rendered with; empty for the base material. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_9 ?">
          <atom type="Label">volume</atom>
          <atom type="Tooltip">The name of a MoonRay volume item that fills this shape. Type the name of another MoonRay item; blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_VdbGeometry_4:sheet">
        <atom type="Label">Ray Tracing</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param27_10 ?">
          <atom type="Label">ray epsilon</atom>
          <atom type="Tooltip">When a secondary ray is fired, anything within this distance of the intersection point will be ignored. Instead, it is considered part of the current intersection's geometry. If zero, an automatically calculated epsilon will be used. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param27_14 ?">
