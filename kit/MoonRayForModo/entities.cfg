    <hash type="Sheet" key="MoonRayEntity_SphereLight_0:sheet">
      <atom type="Label">Properties</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_apply_scene_scale ?">
        <atom type="Label">apply scene scale</atom>
        <atom type="Tooltip">Whether to apply scene scale variable when normalized.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_color ?">
        <atom type="Label">color</atom>
        <atom type="Tooltip">The light's RGB values. These are combined multiplicatively with the intensity and other attributes in determining the light's 3-channel radiance.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_exposure ?">
        <atom type="Label">exposure</atom>
        <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_intensity ?">
        <atom type="Label">intensity</atom>
        <atom type="Tooltip">The light's intensity. This is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_label ?">
        <atom type="Label">label</atom>
        <atom type="Tooltip">Label used in light aov expressions.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_max_shadow_distance ?">
        <atom type="Label">max shadow distance</atom>
        <atom type="Tooltip">The distance from the light beyond which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_mb ?">
        <atom type="Label">mb</atom>
        <atom type="Tooltip">Whether motion-blur is active for this light. When set to true, the scene's illumination will correctly account for any blur() applied to the light's transformation matrix.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_min_shadow_distance ?">
        <atom type="Label">min shadow distance</atom>
        <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_normalized ?">
        <atom type="Label">normalized</atom>
        <atom type="Tooltip">When set to true, the size of the light can be changed without altering the amount of total energy cast into the scene. This is achieved via scaling the light's radiance by the reciprocal of its surface area. When set to false, the radiance is used as-is, regardless of surface area.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_on ?">
        <atom type="Label">on</atom>
        <atom type="Tooltip">Whether the light is switched on.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice24_15 ?">
        <atom type="Label">presence shadows</atom>
        <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_radius ?">
        <atom type="Label">radius</atom>
        <atom type="Tooltip">Radius of the sphere.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_ray_termination ?">
        <atom type="Label">ray termination</atom>
        <atom type="Tooltip">Whether the light is used for ray termination color. Ray termination color is used for filling in falsely dark areas where ray paths have been terminated too early by the depth controls. Such a ray path immediately exits to any ray termination light(s) present in the light set being applied to the lobe, ignoring occlusion by scene geometry. Any light can either be a regular light or a ray termination light (but not both). Thus they can be freely assigned to light sets, which provides a mechanism for applying specific ray termination lights to specific materials, parts or objects. Ray termination color is only applied to non-hair transmission lobes.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice24_24 ?">
        <atom type="Label">texture filter</atom>
        <atom type="Tooltip">The filtering mode to apply to the texture. Nearest neighbor is the cheapest filtering mode but produces a blocky result. Switch linear filtering on for a smoother result. Additionally, mip-mapping can be switched on with either nearest neighbor or linear filtering.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice24_35 ?">
        <atom type="Label">visible in camera</atom>
        <atom type="Tooltip">Whether the light is directly visible in the scene's active camera. When set to "use default" it reads from the value of SceneVariable lights_visible_in_camera.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereLight_1:sheet">
      <atom type="Label">Map</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_contrast ?">
        <atom type="Label">contrast</atom>
        <atom type="Tooltip">Per-channel contrast used in color-correcting the light's texture, if one is present. The operation mimics Nuke's ColorCorrect node's contrast function: For input &gt; 0, output = 0.18 * pow(inputCompnent/0.18, contrast). For input &lt;= 0, output = 0.18 * input * pow(1/0.18, contrast).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_gain ?">
        <atom type="Label">gain</atom>
        <atom type="Tooltip">Per-channel gain used in tandem with a per-channel offset for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_gamma ?">
        <atom type="Label">gamma</atom>
        <atom type="Tooltip">Per-channel gamma used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_offset ?">
        <atom type="Label">offset</atom>
        <atom type="Tooltip">Per-channel offset used in tandem with a per-channel gain for color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = input * gain + offset</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_saturation ?">
        <atom type="Label">saturation</atom>
        <atom type="Tooltip">Per-channel saturation used in color-correcting the light's texture, if one is present. This is achieved by applying the following formula for each channel: output = lerp(luminance(inputRGB), input, saturation).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_temperature ?">
        <atom type="Label">temperature</atom>
        <atom type="Tooltip">Color temperature using Nuke-style T/M/I settings (T = temperature, M = magenta/green, I = intensity). This is achieved as follows: The 3-channel temperature is interpreted as the vector (T,M,I). The followiong scale values are then applied to the RGB components: outputR = inputR * (pow(2,I) + M/3 - T/2) outputG = inputG * (pow(2,I) - 2*M/3 outputB = inputB * (pow(2,I) + M/3 + T/2)</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture ?">
        <atom type="Label">texture</atom>
        <atom type="Tooltip">File name of the texture applied to the light. If set to the empty string, no texture is applied. Any file format supported by OpenImageIO can be used. The texture is used in 2 ways - for looking up the texture value at the intersection point when a ray hits the light, and for building a lookup-table-based auxilliary data structure used for distributing light samples over the texture.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.browse24_21">
        <atom type="Label">Browse for texture...</atom>
        <atom type="Tooltip">Choose the file from a dialog.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_border_color ?">
        <atom type="Label">texture border color</atom>
        <atom type="Tooltip">RGB value used when a texture lookup occurs outside the texture. The MoonRay default applies until this is changed.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_coverage ?">
        <atom type="Label">texture coverage</atom>
        <atom type="Tooltip">Texture scales in the u and v-directions.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_mirror_u ?">
        <atom type="Label">texture mirror u</atom>
        <atom type="Tooltip">Whether to mirror the texture in the u-direction. If set to false, the texture is repeated in the u-direction.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_mirror_v ?">
        <atom type="Label">texture mirror v</atom>
        <atom type="Tooltip">Whether to mirror the texture in the v-direction. If set to false, the texture is repeated in the v-direction.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_reps_u ?">
        <atom type="Label">texture reps u</atom>
        <atom type="Tooltip">Number of times texture repeats in u over the scaled texture space.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_reps_v ?">
        <atom type="Label">texture reps v</atom>
        <atom type="Tooltip">Number of times texture repeats in v over the scaled texture space.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_rotation ?">
        <atom type="Label">texture rotation</atom>
        <atom type="Tooltip">Clockwise rotation angle in degrees.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_texture_translation ?">
        <atom type="Label">texture translation</atom>
        <atom type="Tooltip">Translation of the texture in (u,v)-space, in units of the texture size. For example, a translation of (0.25, 0.5) will translate the texture one-quarter of its width in the u-direction and one-half of its height in the v-direction.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_SphereLight_2:sheet">
      <atom type="Label">Parameters</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.SphereLight$mr_light_filters ?">
        <atom type="Label">light filters</atom>
        <atom type="Tooltip">Vector of LightFilters associated with the light. The names of MoonRay items, separated by commas.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.append24_8 ?">
        <atom type="Label">add to light filters</atom>
        <atom type="Tooltip">Adds one of the MoonRay items in the scene to the list above.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice24_19 ?">
        <atom type="Label">sidedness</atom>
        <atom type="Tooltip">When set to 0 (regular), light is emitted from the outward-facing surface of the sphere. When set to 1 (reverse), light is emitted from the inward-facing surface of the sphere. There is no mode for emitting from both surfaces at the same time, but two sphere lights of opposing sidedness can be combined to achieve this effect.</atom>
      </list>
    </hash>
