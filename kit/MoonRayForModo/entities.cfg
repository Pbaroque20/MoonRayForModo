        <atom type="Label">stereo convergence distance</atom>
        <atom type="Tooltip">Distance at which all the stereo views converge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.PerspectiveCamera$mr_stereo_interocular_distance ?">
