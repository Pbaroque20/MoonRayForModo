    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_4:sheet">
      <atom type="Label">Ray Tracing</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_ray_epsilon ?">
        <atom type="Label">ray epsilon</atom>
        <atom type="Tooltip">When a secondary ray is fired, anything within this distance of the intersection point will be ignored. Instead, it is considered part of the current intersection's geometry. If zero, an automatically calculated epsilon will be used.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_shadow_ray_epsilon ?">
        <atom type="Label">shadow ray epsilon</atom>
        <atom type="Tooltip">When a shadow ray is fired, anything within this distance of the intersection point will be ignored. If this value is less than "ray_epsilon", then it has no additional effect.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_5:sheet">
