    <hash type="Sheet" key="MoonRayEntity0:sheet">
      <atom type="Label">MoonRay Bake Camera</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter0</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_0:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_0 ?">
          <atom type="Label">bias</atom>
          <atom type="Tooltip">Ray-tracing offset for primary ray origin MoonRay's default: 0.003. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_2 ?">
          <atom type="Label">geometry</atom>
          <atom type="Tooltip">The geometry object to bake Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_3 ?">
          <atom type="Label">map factor</atom>
          <atom type="Tooltip">Increase or decrease the internal position map buffer resolution MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_9 ?">
          <atom type="Label">mode</atom>
          <atom type="Tooltip">How to generate primary rays MoonRay's default: 3. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_12 ?">
          <atom type="Label">normal map</atom>
          <atom type="Tooltip">Use this option to supply your own normals that are used when computing ray directions. Without this option, normals are computed from the geometry and do not take into account any material applied normal mapping. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_13 ?">
          <atom type="Label">normal map space</atom>
          <atom type="Tooltip">Use camera space if you generated per frame normal maps in a pre-pass using the normal material aov. You probably want to use tangent space if you are using a normal map that is also used in the surfacing setup. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_15 ?">
          <atom type="Label">udim</atom>
          <atom type="Tooltip">Udim tile to bake MoonRay's default: 1001. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_16 ?">
          <atom type="Label">use relative bias</atom>
          <atom type="Tooltip">If true, bias is scaled based on position magnitude MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_17 ?">
          <atom type="Label">uv attribute</atom>
          <atom type="Tooltip">Specifies a Vec2f primitive attribute to use as the uv coordinates. If empty, the default uv for the mesh is used. The uvs must provide a unique parameterization of the mesh, i.e. a given (u, v) can appear only once on the mesh being baked. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_1:sheet">
        <atom type="Label">Frustum</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_1 ?">
          <atom type="Label">far</atom>
          <atom type="Tooltip">Far clipping plane MoonRay's default: 10000.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_11 ?">
          <atom type="Label">near</atom>
          <atom type="Tooltip">Near clipping plane MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_2:sheet">
        <atom type="Label">Motion Blur</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_4 ?">
          <atom type="Label">mb shutter bias</atom>
          <atom type="Tooltip">Biases the motion blur samples toward one end of the shutter interval. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_5 ?">
          <atom type="Label">mb shutter close</atom>
          <atom type="Tooltip">Frame at which the shutter closes, i.e., the end of the motion blur interval. MoonRay's default: 0.25. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_6 ?">
          <atom type="Label">mb shutter open</atom>
          <atom type="Tooltip">Frame at which the shutter opens, i.e., the beginning of the motion blur interval. MoonRay's default: -0.25. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_3:sheet">
        <atom type="Label">Medium</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_7 ?">
          <atom type="Label">medium geometry</atom>
          <atom type="Tooltip">The geometry the camera is 'inside' to which you'd like the medium_material applied. (The use case for this is typically partially-submerged cameras) Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param0_8 ?">
          <atom type="Label">medium material</atom>
          <atom type="Tooltip">The material the camera is 'inside'. If no medium_geometry is specified, ALL rays will have this initial index of refraction applied. Type the name of another MoonRay item; blank for none.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_4:sheet">
        <atom type="Label">Assignment</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_10 ?">
          <atom type="Label">render through this camera</atom>
          <atom type="Tooltip">Render through this camera, from where this item stands, instead of the Modo camera. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BakeCamera_5:sheet">
        <atom type="Label">Render Masks</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param0_14 ?">
          <atom type="Label">pixel sample map</atom>
          <atom type="Tooltip">Map indicating the number of pixel samples that should be used per pixel (in uniform sampling mode). This is a multiplier on the global pixel sample count specified in SceneVariables. If the provided map has incompatible dimensions, it will be resized. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity1:sheet">
      <atom type="Label">MoonRay Barn Door Light Filter</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter1</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_BarnDoorLightFilter_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param1_0 ?">
          <atom type="Label">color</atom>
          <atom type="Tooltip">Color within the Barn Door lit region. For each color channel 0 is full shadow and 1 is no shadow. MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_1 ?">
          <atom type="Label">density</atom>
          <atom type="Tooltip">Fades the filter effect. 0 means no effect (like having no filter), and 1 means full effect. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_2 ?">
          <atom type="Label">edge</atom>
          <atom type="Tooltip">The size of the transition zone from the rounded box to the outside, as a proportion of width (or height, whichever is smaller). MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_3 ?">
          <atom type="Label">edge scale bottom</atom>
          <atom type="Tooltip">The scale factor for the bottom edge. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_4 ?">
          <atom type="Label">edge scale left</atom>
          <atom type="Tooltip">The scale factor for the left edge. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_5 ?">
          <atom type="Label">edge scale right</atom>
          <atom type="Tooltip">The scale factor for the right edge. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_6 ?">
          <atom type="Label">edge scale top</atom>
          <atom type="Tooltip">The scale factor for the top edge. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_7 ?">
          <atom type="Label">invert</atom>
          <atom type="Tooltip">Swap application of the filter from inside the Barn Door to outside. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_8 ?">
          <atom type="Label">mode</atom>
          <atom type="Tooltip">Analytical mode allows light to shading points that project to the flap opening. Physical mode allows light whose direction goes through the flap opening. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_10 ?">
          <atom type="Label">pre barn distance</atom>
          <atom type="Tooltip">The distance from the BarnDoorLightFilter that the pre_barn_mode control takes effect. MoonRay's default: 0.5. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_11 ?">
          <atom type="Label">pre barn mode</atom>
          <atom type="Tooltip">Force the region before the pre_barn_distance to be fully filtered (black), not filtered at all (white), or treated the same as elsewhere (default). MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_12 ?">
          <atom type="Label">projector focal distance</atom>
          <atom type="Tooltip">The distance of the flap opening from the projector origin. Ignored for orthographic projection. MoonRay's default: 30.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_13 ?">
          <atom type="Label">height of the flap opening</atom>
          <atom type="Tooltip">The height of the frustum at distance 1.0. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_14 ?">
          <atom type="Label">projector type</atom>
          <atom type="Tooltip">The projection type used to map points to the flap opening. Perspective has a focal point, while orthographic does not. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_15 ?">
          <atom type="Label">width of the flap opening</atom>
          <atom type="Tooltip">The width of the frustum at distance 1.0. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_16 ?">
          <atom type="Label">radius</atom>
          <atom type="Tooltip">The radius by which to convert the base box shape into a rounded box, as a proportion of half the width (or height, whichever is smaller). MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_17 ?">
          <atom type="Label">rotation</atom>
          <atom type="Tooltip">The angle to rotate the Barn Door counter-clockwise as seen from the light, in degrees. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_18 ?">
          <atom type="Label">size bottom</atom>
          <atom type="Tooltip">Additional size on the bottom edge. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_19 ?">
          <atom type="Label">size left</atom>
          <atom type="Tooltip">Additional size on the left edge. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_20 ?">
          <atom type="Label">size right</atom>
          <atom type="Tooltip">Additional size on the right edge. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_21 ?">
          <atom type="Label">size top</atom>
          <atom type="Tooltip">Additional size on the top edge. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param1_22 ?">
          <atom type="Label">use light xform</atom>
          <atom type="Tooltip">Attach the filter to the light (in the -Z direction) and ignore node_xform. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BarnDoorLightFilter_1:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param1_9 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Turns the light filter on/off. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity2:sheet">
      <atom type="Label">MoonRay Base Volume</atom>
      <atom type="Layout">properties</atom>
      <atom type="FilterCommand">moonray.entity.filter2</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">130</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_BaseVolume_0:sheet">
        <atom type="Label">Scattering Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param2_0 ?">
          <atom type="Label">anisotropy</atom>
          <atom type="Tooltip">Value in the interval [-1,1] that defines how foward (1) or backward (-1) scattering the volume is. A value of 0.0 indicates an isotropic volume. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_17 ?">
          <atom type="Label">diffuse color</atom>
          <atom type="Tooltip">Reflectance color of the volume. Technically this is called scattering albedo, which is the scattering coefficient divided by the extinction coefficient. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_18 ?">
          <atom type="Label">diffuse colors</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_19 ?">
          <atom type="Label">diffuse distances</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_20 ?">
          <atom type="Label">diffuse interpolations</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_21 ?">
          <atom type="Label">max depth</atom>
          <atom type="Tooltip">Represents the maximum ray depth, or the longest visible distance a ray has to travel through the volume. This sets the upper bound for the ramp. MoonRay's default: 2.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_22 ?">
          <atom type="Label">min depth</atom>
          <atom type="Tooltip">Represents the minimum ray depth, or the shortest visible distance a ray has to travel through the volume. This sets the lower bound for the ramp. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_30 ?">
          <atom type="Label">use ramp</atom>
          <atom type="Tooltip">Use a ramp to define different diffuse colors depending on the depth of the volume. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BaseVolume_1:sheet">
        <atom type="Label">Attenuation Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param2_1 ?">
          <atom type="Label">attenuation color</atom>
          <atom type="Tooltip">A color to tint (multiply to) the attenuation. Technically the product of attenuation color and intensity is the attenuation (extinction) coefficient.(Note the inverse behavior of color with this parameter.) Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_2 ?">
          <atom type="Label">attenuation colors</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_3 ?">
          <atom type="Label">attenuation distances</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_4 ?">
          <atom type="Label">attenuation factor</atom>
          <atom type="Tooltip">Identical in behavior to attenuation_intensity but provided as a second means to control attenuation, intended for use during lighting as a per-shot or per-sequence adjustment. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_5 ?">
          <atom type="Label">attenuation intensity</atom>
          <atom type="Tooltip">The rate at which the light traversing a volume is attenuated. The attenuation (extinction) coefficient is the product of attenuation_color, attenuation_intensity, and attenuation_factor MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_6 ?">
          <atom type="Label">attenuation interpolation types</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_7 ?">
          <atom type="Label">attenuation max depth</atom>
          <atom type="Tooltip">Represents the maximum ray depth, or the longest visible distance a ray has to travel through the volume. This sets the upper bound for the ramp. MoonRay's default: 2.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_8 ?">
          <atom type="Label">attenuation min depth</atom>
          <atom type="Tooltip">Represents the minimum ray depth, or the shortest visible distance a ray has to travel through the volume. This sets the lower bound for the ramp. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_25 ?">
          <atom type="Label">invert attenuation color(s)</atom>
          <atom type="Tooltip">Invert the input attenuation color(s). MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_27 ?">
          <atom type="Label">match diffuse color(s)</atom>
          <atom type="Tooltip">Use the same color(s) for attenuation that is/are being used for diffuse. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_29 ?">
          <atom type="Label">use ramp</atom>
          <atom type="Tooltip">Use a ramp to define different attenuation colors depending on the depth of the volume. MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BaseVolume_2:sheet">
        <atom type="Label">Volume Baking</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param2_9 ?">
          <atom type="Label">bake divisions</atom>
          <atom type="Tooltip">Divide widest axis by this many divisions MoonRay's default: 100. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_10 ?">
          <atom type="Label">bake resolution mode</atom>
          <atom type="Tooltip">Method to specify grid resolution of baked density grid. Choices are: \t\t"default": For shaders that are bound to vdb volumes, use vdb resolution. \t\t\t\t\t\tFor shaders that are bounds to mesh geometries use 100 divisions \t\t"divisions": Specify number of divisions. \t\t"voxel size": Specify voxel size. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_11 ?">
          <atom type="Label">bake voxel size</atom>
          <atom type="Tooltip">Size of voxel in world space MoonRay's default: 10.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BaseVolume_3:sheet">
        <atom type="Label">Density Properties</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param2_12 ?">
          <atom type="Label">densities</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_13 ?">
          <atom type="Label">density distances</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_14 ?">
          <atom type="Label">density interpolations</atom>
          <atom type="Tooltip">Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_15 ?">
          <atom type="Label">max depth</atom>
          <atom type="Tooltip">Represents the maximum ray depth, or the longest visible distance a ray has to travel through the volume. This sets the upper bound for the ramp. MoonRay's default: 2.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_16 ?">
          <atom type="Label">min depth</atom>
          <atom type="Tooltip">Represents the minimum ray depth, or the shortest visible distance a ray has to travel through the volume. This sets the lower bound for the ramp. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_BaseVolume_4:sheet">
        <atom type="Label">Volume</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param2_23 ?">
          <atom type="Label">emission color</atom>
          <atom type="Tooltip">A color multiplier for the emission. The product of emission color and intensity is the emission coefficient MoonRay's default: [0.0, 0.0, 0.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_24 ?">
          <atom type="Label">emission intensity</atom>
          <atom type="Tooltip">The rate at which a volume emits light at a given point. The product of emission color and intensity is the emission coefficient. MoonRay's default: 1.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param2_28 ?">
          <atom type="Label">surface opacity threshold</atom>
          <atom type="Tooltip">Accumulated opacity that's considered the 'surface' for computing surface position and Z MoonRay's default: 0.5. Blank keeps MoonRay's value.</atom>
