    <hash type="Sheet" key="MoonRayEntity_BakeCamera_0:sheet">
      <atom type="Label">Parameters</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_bias ?">
        <atom type="Label">bias</atom>
        <atom type="Tooltip">Ray-tracing offset for primary ray origin</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.pick0_2 ?">
        <atom type="Label">geometry</atom>
        <atom type="Tooltip">The geometry object to bake</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_map_factor ?">
        <atom type="Label">map factor</atom>
        <atom type="Tooltip">Increase or decrease the internal position map buffer resolution</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice0_9 ?">
        <atom type="Label">mode</atom>
        <atom type="Tooltip">How to generate primary rays</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_normal_map ?">
        <atom type="Label">normal map</atom>
        <atom type="Tooltip">Use this option to supply your own normals that are used when computing ray directions. Without this option, normals are computed from the geometry and do not take into account any material applied normal mapping.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.browse0_12">
        <atom type="Label">Browse for normal map...</atom>
        <atom type="Tooltip">Choose the file from a dialog.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice0_13 ?">
        <atom type="Label">normal map space</atom>
        <atom type="Tooltip">Use camera space if you generated per frame normal maps in a pre-pass using the normal material aov. You probably want to use tangent space if you are using a normal map that is also used in the surfacing setup.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_udim ?">
        <atom type="Label">udim</atom>
        <atom type="Tooltip">Udim tile to bake</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_use_relative_bias ?">
        <atom type="Label">use relative bias</atom>
        <atom type="Tooltip">If true, bias is scaled based on position magnitude</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_uv_attribute ?">
        <atom type="Label">uv attribute</atom>
        <atom type="Tooltip">Specifies a Vec2f primitive attribute to use as the uv coordinates. If empty, the default uv for the mesh is used. The uvs must provide a unique parameterization of the mesh, i.e. a given (u, v) can appear only once on the mesh being baked.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BakeCamera_1:sheet">
      <atom type="Label">Frustum</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_far ?">
        <atom type="Label">far</atom>
        <atom type="Tooltip">Far clipping plane</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_near ?">
        <atom type="Label">near</atom>
        <atom type="Tooltip">Near clipping plane</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BakeCamera_2:sheet">
      <atom type="Label">Motion Blur</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_mb_shutter_bias ?">
        <atom type="Label">mb shutter bias</atom>
        <atom type="Tooltip">Biases the motion blur samples toward one end of the shutter interval.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_mb_shutter_close ?">
        <atom type="Label">mb shutter close</atom>
        <atom type="Tooltip">Frame at which the shutter closes, i.e., the end of the motion blur interval.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_mb_shutter_open ?">
        <atom type="Label">mb shutter open</atom>
        <atom type="Tooltip">Frame at which the shutter opens, i.e., the beginning of the motion blur interval.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BakeCamera_3:sheet">
      <atom type="Label">Medium</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_medium_geometry ?">
        <atom type="Label">medium geometry</atom>
        <atom type="Tooltip">The geometry the camera is 'inside' to which you'd like the medium_material applied. (The use case for this is typically partially-submerged cameras) Type the name of the object this refers to; blank for none.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_medium_material ?">
        <atom type="Label">medium material</atom>
        <atom type="Tooltip">The material the camera is 'inside'. If no medium_geometry is specified, ALL rays will have this initial index of refraction applied. Type the name of the object this refers to; blank for none.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BakeCamera_4:sheet">
      <atom type="Label">Assignment</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_modo_render_camera ?">
        <atom type="Label">render through this camera</atom>
        <atom type="Tooltip">Render through this camera, from where this item stands, instead of the Modo camera.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BakeCamera_5:sheet">
      <atom type="Label">Render Masks</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BakeCamera$mr_pixel_sample_map ?">
        <atom type="Label">pixel sample map</atom>
        <atom type="Tooltip">Map indicating the number of pixel samples that should be used per pixel (in uniform sampling mode). This is a multiplier on the global pixel sample count specified in SceneVariables. If the provided map has incompatible dimensions, it will be resized.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity1:sheet">
      <atom type="Label">MoonRay Barn Door Light Filter</atom>
      <atom type="Layout">properties</atom>
