        </list>
        <list type="Control" val="cmd moonray.entity.param12_11 ?">
          <atom type="Label">min shadow distance</atom>
          <atom type="Tooltip">The distance from the light before which a light-receiving surface will no longer receive shadows cast from that light. Note that the distance is thresholded for each occlusion ray cast for this light, it is possible for a receiving point to lie at an intermediate distance such that some parts of the light are closer than the threshold distance and other parts beyond it, in which case the point will appearto be in partial shadow. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param12_12 ?">
          <atom type="Label">normalized</atom>
          <atom type="Tooltip">If set to true, a normalisation factor is applied to the light's radiance. The normalisation factor used is such that if a distant light of radiance (1,1,1) is directly overhead a Lambertian surface of colour (1,1,1), the resulting outgoing radiance at the surface will be (1,1,1) regardless of the light's angular extent. If set to false, the light's radiance is used as-is. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param12_14 ?">
          <atom type="Label">on</atom>
          <atom type="Tooltip">Whether the light is switched on. MoonRay's default: true. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param12_15 ?">
          <atom type="Label">presence shadows</atom>
          <atom type="Tooltip">Switch this attribute on for shadows cast from this light to correctly respect presence values. When off, surfaces with a material with presence less than 1.0 will cast opaque shadows from this light. This is an optimization - when the attribute is off, occlusion rays (fast) are used for testing for shadows. When it is on, regular rays (slower) are used, and the material's presence is evaluated to determine how much shadowing should occur. When set to "use default" it reads from the value of SceneVariable enable_presence_shadows. MoonRay's default: 2. Default keeps MoonRay's value.</atom>
        </list>
