    <hash type="Sheet" key="MoonRayEntity_RodLightFilter_0:sheet">
      <atom type="Label">Properties</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_color ?">
        <atom type="Label">color</atom>
        <atom type="Tooltip">Filter color. Scales the light within the volume. For each color channel: 0 means full shadow, 1 means no shadow.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_density ?">
        <atom type="Label">density</atom>
        <atom type="Tooltip">Fades the filter effect. 0 means no effect (like having no filter). 1 means full effect.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_depth ?">
        <atom type="Label">depth</atom>
        <atom type="Tooltip">Depth of the base box (before radius and edge).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_edge ?">
        <atom type="Label">edge</atom>
        <atom type="Tooltip">Size of transition zone from the rounded box to the outside.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_height ?">
        <atom type="Label">height</atom>
        <atom type="Tooltip">Height of the base box (before radius and edge).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_intensity ?">
        <atom type="Label">intensity</atom>
        <atom type="Tooltip">Scalar for multiplying the color. 0 means black, 1 means no change.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_invert ?">
        <atom type="Label">invert</atom>
        <atom type="Tooltip">Swap application of filter from inside the volume to outside.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_radius ?">
        <atom type="Label">radius</atom>
        <atom type="Tooltip">Radius by which to expand the base box into a rounded box.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_ramp_in_distances ?">
        <atom type="Label">input distance for ramp control</atom>
        <atom type="Tooltip">Input distance for ramp control. Type the numbers separated by spaces: 0 0.5 1. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_ramp_interpolation_types ?">
        <atom type="Label">interpolation types</atom>
        <atom type="Tooltip">Interpolation types for ramp control. Type the numbers separated by spaces: 0 0.5 1. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_ramp_out_distances ?">
        <atom type="Label">remapped distances for ramp control</atom>
        <atom type="Tooltip">Remapped distances for ramp control. Type the numbers separated by spaces: 0 0.5 1. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.RodLightFilter$mr_width ?">
        <atom type="Label">width</atom>
        <atom type="Tooltip">Width of the base box (before radius and edge).</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_RodLightFilter_1:sheet">
