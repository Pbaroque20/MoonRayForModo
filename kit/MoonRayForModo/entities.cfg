        <atom type="Tooltip">Represents the minimum ray depth, or the shortest visible distance a ray has to travel through the volume. This sets the lower bound for the ramp.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_use_diffuse_ramp ?">
        <atom type="Label">use ramp</atom>
        <atom type="Tooltip">Use a ramp to define different diffuse colors depending on the depth of the volume.</atom>
      </list>
