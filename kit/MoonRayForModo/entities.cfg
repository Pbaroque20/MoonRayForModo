      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_6:sheet">
      <atom type="Label">Motion Blur</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_velocity_grid ?">
        <atom type="Label">velocity grid</atom>
        <atom type="Tooltip">the name of vector grid representing the velocity field. Usually named "v" or "vel" in simulation export. If multiple velocity grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "v[3]". The index must be in [] brackets. The index can be different from the index on the "density_grid".</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_velocity_sample_rate ?">
        <atom type="Label">velocity sample rate</atom>
        <atom type="Tooltip">the relative scale of input velocity grid resolution. Lower value has lower memory overhead and lower fidelity of motion blur effect, which is sometimes desired for artistic reasons</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_velocity_scale ?">
        <atom type="Label">velocity scale</atom>
        <atom type="Tooltip">A scale factor for the velocity field. A value of 0 disables motion blur.</atom>
      </list>
    </hash>
