      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">40</atom>
      </hash>
      <list type="Control" val="sub MoonRayEntity_BarnDoorLightFilter_0:sheet">
        <atom type="Label">Properties</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">MoonRayEntity_BarnDoorLightFilter_0:sheet</atom>
      </list>
      <list type="Control" val="sub MoonRayEntity_BarnDoorLightFilter_1:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <atom type="StartCollapsed">1</atom>
        <atom type="Hash">MoonRayEntity_BarnDoorLightFilter_1:sheet</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_BarnDoorLightFilter_0:sheet">
      <atom type="Label">Properties</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_color ?">
        <atom type="Label">color</atom>
        <atom type="Tooltip">Color within the Barn Door lit region. For each color channel 0 is full shadow and 1 is no shadow.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_density ?">
        <atom type="Label">density</atom>
        <atom type="Tooltip">Fades the filter effect. 0 means no effect (like having no filter), and 1 means full effect.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_edge ?">
        <atom type="Label">edge</atom>
        <atom type="Tooltip">The size of the transition zone from the rounded box to the outside, as a proportion of width (or height, whichever is smaller).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_edge_scale_bottom ?">
        <atom type="Label">edge scale bottom</atom>
        <atom type="Tooltip">The scale factor for the bottom edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_edge_scale_left ?">
        <atom type="Label">edge scale left</atom>
        <atom type="Tooltip">The scale factor for the left edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_edge_scale_right ?">
        <atom type="Label">edge scale right</atom>
        <atom type="Tooltip">The scale factor for the right edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_edge_scale_top ?">
        <atom type="Label">edge scale top</atom>
        <atom type="Tooltip">The scale factor for the top edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_invert ?">
        <atom type="Label">invert</atom>
        <atom type="Tooltip">Swap application of the filter from inside the Barn Door to outside.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice1_8 ?">
        <atom type="Label">mode</atom>
        <atom type="Tooltip">Analytical mode allows light to shading points that project to the flap opening. Physical mode allows light whose direction goes through the flap opening.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_pre_barn_distance ?">
        <atom type="Label">pre barn distance</atom>
        <atom type="Tooltip">The distance from the BarnDoorLightFilter that the pre_barn_mode control takes effect.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice1_11 ?">
        <atom type="Label">pre barn mode</atom>
        <atom type="Tooltip">Force the region before the pre_barn_distance to be fully filtered (black), not filtered at all (white), or treated the same as elsewhere (default).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_projector_focal_distance ?">
        <atom type="Label">projector focal distance</atom>
        <atom type="Tooltip">The distance of the flap opening from the projector origin. Ignored for orthographic projection.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_projector_height ?">
        <atom type="Label">height of the flap opening</atom>
        <atom type="Tooltip">The height of the frustum at distance 1.0.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice1_14 ?">
        <atom type="Label">projector type</atom>
        <atom type="Tooltip">The projection type used to map points to the flap opening. Perspective has a focal point, while orthographic does not.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_projector_width ?">
        <atom type="Label">width of the flap opening</atom>
        <atom type="Tooltip">The width of the frustum at distance 1.0.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_radius ?">
        <atom type="Label">radius</atom>
        <atom type="Tooltip">The radius by which to convert the base box shape into a rounded box, as a proportion of half the width (or height, whichever is smaller).</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_rotation ?">
        <atom type="Label">rotation</atom>
        <atom type="Tooltip">The angle to rotate the Barn Door counter-clockwise as seen from the light, in degrees.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_size_bottom ?">
        <atom type="Label">size bottom</atom>
        <atom type="Tooltip">Additional size on the bottom edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_size_left ?">
        <atom type="Label">size left</atom>
        <atom type="Tooltip">Additional size on the left edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_size_right ?">
        <atom type="Label">size right</atom>
        <atom type="Tooltip">Additional size on the right edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_size_top ?">
        <atom type="Label">size top</atom>
        <atom type="Tooltip">Additional size on the top edge.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BarnDoorLightFilter$mr_use_light_xform ?">
        <atom type="Label">use light xform</atom>
        <atom type="Tooltip">Attach the filter to the light (in the -Z direction) and ignore node_xform.</atom>
      </list>
    </hash>
