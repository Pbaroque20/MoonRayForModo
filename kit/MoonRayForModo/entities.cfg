        <list type="Control" val="cmd moonray.entity.param27_21 ?">
          <atom type="Label">velocity sample rate</atom>
          <atom type="Tooltip">the relative scale of input velocity grid resolution. Lower value has lower memory overhead and lower fidelity of motion blur effect, which is sometimes desired for artistic reasons MoonRay's default: 0.2. Blank keeps MoonRay's value.</atom>
