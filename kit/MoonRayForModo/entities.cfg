          <atom type="Label">velocity grid</atom>
          <atom type="Tooltip">the name of vector grid representing the velocity field. Usually named "v" or "vel" in simulation export. If multiple velocity grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "v[3]". The index must be in [] brackets. The index can be different from the index on the "density_grid". MoonRay's default: "". Blank keeps MoonRay's value.</atom>
