    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_0:sheet">
      <atom type="Label">Parameters</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_contains_camera ?">
        <atom type="Label">contains camera</atom>
        <atom type="Tooltip">Specifies whether the geometry contains the camera and should be used for IOR tracking. This should not be changed by the user -- they should instead attach the relevant geometry to the camera, which will then flag this geometry.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.pick27_2 ?">
        <atom type="Label">dicing camera</atom>
        <atom type="Tooltip">Alternate camera that is used for adaptive tessellation. This is useful if you want adaptive tessellation to behave consistently in a sequence, regardless of what the main camera is doing</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_references ?">
        <atom type="Label">references</atom>
        <atom type="Tooltip">list of geometries that geometry procedural can reference during procedural generate/update stages. For example, an instancer geometry procedural can instance primitives generated by the reference geometry procedural. The names of MoonRay items, separated by commas.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.append27_11 ?">
        <atom type="Label">add to references</atom>
        <atom type="Tooltip">Adds one of the MoonRay items in the scene to the list above.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_shadow_exclusion_mappings ?">
        <atom type="Label">shadow exclusion mappings</atom>
        <atom type="Tooltip">A space-separated list of mappings of the form A:B where: A is a comma-separated list of names of parts of this Geometry, or an asterisk to specify the whole geometry; B is a comma-separated list of shadow receiver set labels established using the ["shadow_receiver_label"] attribute, or an asterisk to specify to all such sets in the scene. For each of the listed mappings, shadows from the parts specified in A will be suppressed from casting onto any geometries in the ShadowReceiverSets specified in B. **Note: no part name should appear more than once in the string, otherwise the behavior is undefined.**</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_static ?">
        <atom type="Label">static</atom>
        <atom type="Tooltip">disable if the geometry will be updated between frames</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_use_local_camera_motion_blur ?">
        <atom type="Label">use local camera motion blur</atom>
        <atom type="Tooltip">Enables experimental feature that also attempts to remove the camera blur in the local regions</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_use_local_motion_blur ?">
        <atom type="Label">use local motion blur</atom>
        <atom type="Tooltip">Enables the local motion blur feature, which makes the geometry procedural responsible for handling all of the geometry's motion and allows for custom effects</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_1:sheet">
      <atom type="Label">VDB</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_density_grid ?">
        <atom type="Label">density grid</atom>
        <atom type="Tooltip">The name of the density grid. If multiple grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "density[3]". The index must be in [] brackets.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_emission_grid ?">
        <atom type="Label">emission grid</atom>
        <atom type="Tooltip">The name of the emission grid. If multiple grids have the same name, only the first grid with that name will be loaded. If a vdb file has multiple grids with the same name, you may use a suffix index to pick which grid to load, e.g. "emission[3]". The index must be in [] brackets.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_emission_sample_rate ?">
        <atom type="Label">emission sample rate</atom>
        <atom type="Tooltip">the relative scale of input emission grid resolution. Lower value has lower memory overhead and faster render time, with the cost of lower fidelity of emission shape and illumination</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.choice27_5 ?">
        <atom type="Label">interpolation</atom>
        <atom type="Tooltip">Voxel interpolation to use when sampling the volume data</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_model ?">
        <atom type="Label">model</atom>
        <atom type="Tooltip">The VDB file to load</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.browse27_7">
        <atom type="Label">Browse for model...</atom>
        <atom type="Tooltip">Choose the file from a dialog.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_2:sheet">
      <atom type="Label">Labels</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_label ?">
        <atom type="Label">label</atom>
        <atom type="Tooltip">label used in material aov expresssions</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_shadow_receiver_label ?">
        <atom type="Label">shadow receiver label</atom>
        <atom type="Tooltip">Label used to associate Geometry objects into ShadowReceiverSets. Using this in combination with the ["shadow_exclusion_mappings"] attribute, shadows from specified geometries or their parts can be suppressed from casting shadows onto one or more specified sets.</atom>
      </list>
    </hash>
    <hash type="Sheet" key="MoonRayEntity_VdbGeometry_3:sheet">
      <atom type="Label">Assignment</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.VdbGeometry$mr_modo_material ?">
        <atom type="Label">material tag</atom>
        <atom type="Tooltip">The material tag of the Modo material this is rendered with; empty for the base material.</atom>
      </list>
      <list type="Control" val="cmd moonray.entity.pick27_9 ?">
        <atom type="Label">volume</atom>
        <atom type="Tooltip">The name of a MoonRay volume item that fills this shape.</atom>
