          <atom type="Tooltip">The light's exposure value. This value provides an alternative to the intensity value as a mechanism for controlling the light's overall brightness, and is inspired by the corresponding photographic term but is generalised to apply independently to each light. To calculate its effect, pow(2, exposure) is combined multiplicatively with the color and other attributes in determining the light's 3-channel radiance. MoonRay's default: 0.0. Blank keeps MoonRay's value.</atom>
