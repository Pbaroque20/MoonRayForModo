      <list type="Control" val="sub MoonRayEntity_CutoutVolume_0:sheet">
        <atom type="Label">Volume Baking</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param8_0 ?">
          <atom type="Label">bake divisions</atom>
          <atom type="Tooltip">Divide widest axis by this many divisions MoonRay's default: 100. Blank keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param8_1 ?">
          <atom type="Label">bake resolution mode</atom>
          <atom type="Tooltip">Method to specify grid resolution of baked density grid. Choices are: \t\t"default": For shaders that are bound to vdb volumes, use vdb resolution. \t\t\t\t\t\tFor shaders that are bounds to mesh geometries use 100 divisions \t\t"divisions": Specify number of divisions. \t\t"voxel size": Specify voxel size. MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param8_2 ?">
          <atom type="Label">bake voxel size</atom>
          <atom type="Tooltip">Size of voxel in world space MoonRay's default: 10.0. Blank keeps MoonRay's value.</atom>
        </list>
      </list>
      <list type="Control" val="sub MoonRayEntity_CutoutVolume_1:sheet">
        <atom type="Label">Parameters</atom>
        <atom type="ShowLabel">1</atom>
        <list type="Control" val="cmd moonray.entity.param8_3 ?">
          <atom type="Label">indirect volume</atom>
          <atom type="Tooltip">The volume to cutout / use for indirect illumination and occlusion. Cutout behavior is invoked for primary rays but secondary/indirect rays are processed normally. Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param8_4 ?">
          <atom type="Label">label</atom>
          <atom type="Tooltip">label used in light aovs MoonRay's default: "". Blank keeps MoonRay's value.</atom>
