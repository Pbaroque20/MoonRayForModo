    <hash type="Sheet" key="MoonRayEntity_BaseVolume_1:sheet">
      <atom type="Label">Attenuation Properties</atom>
      <atom type="Layout">properties</atom>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_color ?">
        <atom type="Label">attenuation color</atom>
        <atom type="Tooltip">A color to tint (multiply to) the attenuation. Technically the product of attenuation color and intensity is the attenuation (extinction) coefficient.(Note the inverse behavior of color with this parameter.) The MoonRay default applies until this is changed.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_colors ?">
        <atom type="Label">attenuation colors</atom>
        <atom type="Tooltip">Type the entries separated by semicolons, each as its numbers: 1 0 0; 0 1 0. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_distances ?">
        <atom type="Label">attenuation distances</atom>
        <atom type="Tooltip">Type the numbers separated by spaces: 0 0.5 1. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_factor ?">
        <atom type="Label">attenuation factor</atom>
        <atom type="Tooltip">Identical in behavior to attenuation_intensity but provided as a second means to control attenuation, intended for use during lighting as a per-shot or per-sequence adjustment.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_intensity ?">
        <atom type="Label">attenuation intensity</atom>
        <atom type="Tooltip">The rate at which the light traversing a volume is attenuated. The attenuation (extinction) coefficient is the product of attenuation_color, attenuation_intensity, and attenuation_factor</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_interpolations ?">
        <atom type="Label">attenuation interpolation types</atom>
        <atom type="Tooltip">Type the numbers separated by spaces: 0 0.5 1. Blank keeps the MoonRay default.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_max_depth ?">
        <atom type="Label">attenuation max depth</atom>
        <atom type="Tooltip">Represents the maximum ray depth, or the longest visible distance a ray has to travel through the volume. This sets the upper bound for the ramp.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_attenuation_min_depth ?">
        <atom type="Label">attenuation min depth</atom>
        <atom type="Tooltip">Represents the minimum ray depth, or the shortest visible distance a ray has to travel through the volume. This sets the lower bound for the ramp.</atom>
      </list>
      <list type="Control" val="cmd item.channel moonray.BaseVolume$mr_invert_attenuation_color ?">
