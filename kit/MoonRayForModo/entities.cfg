          <atom type="Label">gamma</atom>
          <atom type="Tooltip">Per-channel gamma used in color-correcting the light filter's texture, if one is present. This is achieved by applying the following formula for each channel: For input &gt; 0, output = pow(input, gamma) For input &lt;= 0, output = input MoonRay's default: [1.0, 1.0, 1.0]. Blank keeps MoonRay's value. Type colours, vectors and lists as [x, y, z].</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param7_9 ?">
          <atom type="Label">invert</atom>
          <atom type="Tooltip">Inverts the map MoonRay's default: false. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param7_11 ?">
          <atom type="Label">outside projection</atom>
          <atom type="Tooltip">What happens outside the frustum of the projection camera. Black (default), White, or Default (This uses the mode set on the Moonray map shader) MoonRay's default: 0. Default keeps MoonRay's value.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param7_12 ?">
          <atom type="Label">projector</atom>
          <atom type="Tooltip">If a projector is specified, it overrides the node_xform and projector_* attributes Type the name of another MoonRay item; blank for none.</atom>
        </list>
        <list type="Control" val="cmd moonray.entity.param7_17 ?">
          <atom type="Label">texture</atom>
          <atom type="Tooltip">File name of the texture applied to the light filter. Any file format supported by OpenImageIO can be used. MoonRay's default: "". Blank keeps MoonRay's value.</atom>
        </list>
      </list>
